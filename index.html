<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zachary Urdaneta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       THEME VARIABLES
       ============================================================ */
    :root {
      --bg: #f9f8f6;
      --text-main: #1a1a1a;
      --text-muted: #333333;
      --text-subtle: #666666;
      --text-dim: #999999;
      --text-nav: #888888;
      --border: #d8d5d0;
      --border-subtle: #e8e5e1;
      
      --card-bg: #ffffff;
      --card-border: #e2ded8;
      --card-shadow: rgba(0, 0, 0, 0.02);
      --card-shadow-hover: rgba(0, 0, 0, 0.04);
      
      --accent: #185FA5;
      --accent-hover: #0C447C;
      --accent-pill-bg: #f0f6fc;
      --accent-pill-border: #c8def8;
      --accent-pill-hover: #e1effd;
      
      --player-bg: #faf9f7;
      --player-border: #eae6df;
      --progress-bg: #e2ded8;
      
      --table-th-bg: #f0eee9;
      --toc-bg: #ffffff;
      --toc-border: #e0ddd8;
      --quote-text: #444444;
    }

    [data-theme="dark"] {
      --bg: #141414;
      --text-main: #f0f0f0;
      --text-muted: #c4c4c4;
      --text-subtle: #8e8e8e;
      --text-dim: #666666;
      --text-nav: #888888;
      --border: #2a2a2a;
      --border-subtle: #242424;
      
      --card-bg: #1c1c1c;
      --card-border: #2c2c2c;
      --card-shadow: rgba(0, 0, 0, 0.2);
      --card-shadow-hover: rgba(0, 0, 0, 0.35);
      
      --accent: #4a9ff5;
      --accent-hover: #6db2f7;
      --accent-pill-bg: #1a2634;
      --accent-pill-border: #244263;
      --accent-pill-hover: #22354a;
      
      --player-bg: #181818;
      --player-border: #282828;
      --progress-bg: #333333;
      
      --table-th-bg: #222222;
      --toc-bg: #1a1a1a;
      --toc-border: #2c2c2c;
      --quote-text: #aaaaaa;
    }

    /* ============================================================
       BASE STYLES
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'DM Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text-main); 
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    nav { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      max-width: 760px; 
      margin: 0 auto; 
      padding: 2rem 1.5rem; 
      border-bottom: 0.5px solid var(--border); 
    }
    .nav-name { font-family: 'DM Serif Display', serif; font-size: 18px; letter-spacing: -0.3px; cursor: pointer; color: var(--text-main); }
    .nav-right { display: flex; align-items: center; gap: 1.5rem; }
    .nav-links { display: flex; gap: 1.75rem; }
    .nav-links a { font-size: 13px; color: var(--text-nav); cursor: pointer; transition: color 0.15s; text-decoration: none; }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
    
    .theme-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-nav);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .theme-toggle-btn:hover {
      color: var(--text-main);
      background: var(--player-bg);
    }
    
    main { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
    section { display: none; animation: fadeIn 0.2s ease; }
    section.visible { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    .hero h2 { font-family: 'DM Serif Display', serif; font-size: 36px; letter-spacing: -0.3px; font-weight: 400; margin-bottom: 0.5rem; }
    .hero p { font-size: 15px; line-height: 1.85; color: var(--text-muted); max-width: 580px; }
    .hero-meta { margin-top: 1.5rem; font-size: 13px; color: var(--text-dim); }
    .divider { width: 48px; height: 1px; background: var(--border); margin-bottom: 1.5rem; }
    
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem; border-bottom: 0.5px solid var(--border); padding-bottom: 1rem; }
    .section-header h2 { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.3px; }
    .count-badge { font-size: 12px; color: var(--text-dim); }
    
    /* Essays List */
    .essay-list { display: flex; flex-direction: column; }
    .essay-item { padding: 1.25rem 0; border-bottom: 0.5px solid var(--border-subtle); display: grid; grid-template-columns: minmax(0,1fr) 75px; gap: 1rem; cursor: pointer; transition: opacity 0.15s; }
    .essay-item:hover { opacity: 0.65; }
    .essay-title { font-size: 15px; font-weight: 500; line-height: 1.4; margin-bottom: 0.35rem; color: var(--text-main); }
    .essay-desc { font-size: 13px; color: var(--text-subtle); line-height: 1.65; }
    .essay-year { font-size: 12px; color: var(--text-dim); text-align: right; padding-top: 3px; }
    
    /* Essay Reader View */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-nav); cursor: pointer; margin-bottom: 2rem; transition: color 0.15s; }
    .back-btn:hover { color: var(--text-main); }
    .reader-title { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1.25; letter-spacing: -0.4px; margin-bottom: 0.75rem; color: var(--text-main); }
    .reader-meta { font-size: 13px; color: var(--text-dim); margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 0.5px solid var(--border); }
    
    .reader-content { max-width: 680px; margin: 0 auto; }
    .reader-content h2 { font-family: 'DM Serif Display', serif; font-size: 22px; margin-top: 2.5rem; margin-bottom: 1rem; letter-spacing: -0.2px; color: var(--text-main); }
    .reader-content h3 { font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 15.5px; color: var(--accent); margin-top: 1.75rem; margin-bottom: 0.5rem; }
    .reader-content p { font-size: 15.5px; line-height: 1.85; color: var(--text-muted); margin-bottom: 1.25rem; scroll-margin-top: 2rem; }
    .reader-content table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 14px; }
    .reader-content th, .reader-content td { text-align: left; padding: 0.6rem 0.75rem; border: 0.5px solid var(--border); vertical-align: top; line-height: 1.6; color: var(--text-muted); }
    .reader-content th { background: var(--table-th-bg); font-weight: 500; color: var(--text-main); }
    .reader-content sup { font-size: 11px; }
    .reader-content sup a { color: var(--accent); text-decoration: none; }
    
    .toc { background: var(--toc-bg); border: 0.5px solid var(--toc-border); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 2.5rem; }
    .toc-title { font-size: 11px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }
    .toc ol { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .toc li a { font-size: 14px; color: var(--accent); }
    .toc li a:hover { text-decoration: underline; }

    .outline-block { background: var(--toc-bg); border: 0.5px solid var(--toc-border); border-radius: 10px; padding: 1rem 1.25rem; margin: 0.75rem 0 1.5rem; }
    .outline-label { font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 0.4rem; }
    .outline-greek { font-size: 14.5px; color: var(--accent); line-height: 1.7; font-style: italic; }
    .outline-section-title { font-family: 'DM Serif Display', serif; font-size: 17px; margin-top: 1.75rem; margin-bottom: 0.5rem; color: var(--text-main); }

    .footnotes { margin-top: 3rem; padding-top: 2rem; border-top: 0.5px solid var(--border); }
    .footnotes h2 { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 1rem; color: var(--text-main); }
    .footnotes ol { padding-left: 1.25rem; }
    .footnotes li { font-size: 13px; color: var(--text-subtle); line-height: 1.7; margin-bottom: 0.6rem; scroll-margin-top: 2rem; }
    .footnotes li a.backref { color: var(--accent); text-decoration: none; margin-left: 4px; }
    
    .bibliography { margin-top: 3rem; padding-top: 2rem; border-top: 0.5px solid var(--border); }
    .bibliography h2 { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 1rem; color: var(--text-main); }
    .bibliography p { font-size: 13.5px; line-height: 1.7; color: var(--text-muted); margin-bottom: 0.75rem; text-indent: -1.25rem; padding-left: 1.25rem; }

    /* Messages / Audio Player */
    .message-list { display: flex; flex-direction: column; gap: 1.25rem; }
    .message-card { 
      background: var(--card-bg); 
      border: 0.5px solid var(--card-border); 
      border-radius: 14px; 
      padding: 1.35rem 1.5rem; 
      box-shadow: 0 2px 6px var(--card-shadow);
      transition: box-shadow 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .message-card:hover { box-shadow: 0 4px 12px var(--card-shadow-hover); }
    .message-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.15rem; }
    .message-title { font-size: 15.5px; font-weight: 500; color: var(--text-main); line-height: 1.4; margin-bottom: 3px; }
    .message-sub { font-size: 12.5px; color: var(--text-subtle); }
    .download-icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-pill-bg);
      border: 0.5px solid var(--accent-pill-border);
      border-radius: 6px;
      padding: 5px 10px;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    .download-icon-btn:hover { background: var(--accent-pill-hover); text-decoration: none; }

    .audio-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--player-bg);
      border: 0.5px solid var(--player-border);
      padding: 8px 14px;
      border-radius: 10px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .ctrl-btn:hover { background: var(--accent-hover); }
    .ctrl-btn:active { transform: scale(0.96); }

    .play-icon-shape {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 5px 0 5px 9px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }
    .pause-icon-shape { display: flex; gap: 3px; height: 10px; }
    .pause-icon-shape span { display: block; width: 3px; height: 10px; background: #fff; border-radius: 1px; }

    .time-display { font-size: 11.5px; color: var(--text-subtle); font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
    .progress-bar-container { flex: 1; position: relative; height: 6px; background: var(--progress-bg); border-radius: 3px; cursor: pointer; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 3px; width: 0%; pointer-events: none; }

    @media (max-width: 520px) {
      nav { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
      .nav-right { width: 100%; justify-content: space-between; }
    }
  </style>
</head>

<!-- ── ESSAYS DATA ────────────────────────────────────────── -->
<script>
const ESSAYS = [
  {
    title: "Ephesians 3:1–6 | The Mystery of Christ Revealed",
    desc: "A Sunday School lesson summary exploring Paul's apostolic stewardship and how Christ unites believing Jews and Gentiles as fellow heirs, members, and partakers of the promise.",
    year: "Aug 2026",
    content: `
      <p>A Sunday School lesson summary exploring Paul's apostolic stewardship and how Christ unites believing Jews and Gentiles as fellow heirs, members, and partakers of the promise.</p>
    `
  },
  {
    title: "The Consummate Blasphemy: Antichrist in the Epistles and Revelation",
    desc: "Traces the New Testament's teaching on the antichrist through Paul's man of lawlessness in 2 Thessalonians 2, John's many antichrists in 1 & 2 John, and the beasts of Revelation, arguing that Christ will decisively judge this final blasphemous imitator at His return.",
    year: "Apr 2026",
    content: `
      <p>Traces the New Testament's teaching on the antichrist through Paul's man of lawlessness in 2 Thessalonians 2, John's many antichrists in 1 & 2 John, and the beasts of Revelation, arguing that Christ will decisively judge this final blasphemous imitator at His return.</p>
    `
  },
  {
    title: "In Heaven, on Earth, and Under the Earth: Christ's Victorious Descent",
    desc: "Examines the biblical and theological foundation of Christ's descent to the dead on Holy Saturday, arguing from Ephesians 4, 1 Peter 3, and the Old Testament that the descent represents not suffering or postmortem evangelism, but the triumphant beginning of Christ's exaltation over demonic powers and death.",
    year: "Apr 2026",
    content: `
      <div class="toc">
        <div class="toc-title">Contents</div>
        <ol>
            <li><a href="#the-descent-defined">The Descent Defined</a></li>
            <li><a href="#the-descent-defended">The Descent Defended</a></li>
            <li><a href="#the-descent-applied">The Descent Applied</a></li>
            <li><a href="#appendix">Appendix: Table 1</a></li>
        </ol>
      </div>

      <article>
        <p>Christians everywhere affirm that Christ was crucified, dead, and buried, and on the third day rose again from the dead. However, the clause between Christ's death and resurrection in both the Apostle's Creed and Athanasian Creed is often overlooked: "he descended into hell." Believers should ask what the Bible reveals about the realm(s) of the dead, the state of the faithful dead before Christ's work of redemption, and Christ's burial and resurrection. To put it simply: What does Scripture say that Jesus did on Holy Saturday? This paper will articulate an approach to the doctrine of the descent, nuance and defend it against differing approaches and outright rejections and show the merits of this doctrine in the life of the Christian.</p>

        <h2 id="the-descent-defined">The Descent Defined</h2>
        <p>Examining the biblical presentation of the location and state of the dead sets the appropriate context for Christ's descent. The Old Testament presents Sheol as, in the words of Paul Williamson, the "realm of the dead, a place to which everyone descends at death regardless of spiritual status."<sup id="fnref1"><a href="#fn1">1</a></sup> Ethan the Ezrahite asks, "What man can live and not see death? Can he provide his soul escape from the power of Sheol?" (Ps 89:48). While the righteous are spared torment in Sheol, the wicked cannot be said to dwell there happily, as illustrated by the sons of Korah, who are swallowed by the earth and descend to Sheol alive (Num 16:30–33; cf. Deut 32:22; Ps 9:17; 49:14; Prov 5:5). "Sheol" can thus refer to the general realm of the dead, but also specifically describe "the realm to which the wicked go when they die under God's wrath."<sup id="fnref2"><a href="#fn2">2</a></sup> Matthew Emerson summarizes, "Sheol in the Old Testament and Hades in the LXX and in Greco-Roman thought can be used to refer to both a general place for all the dead as well as a place of torment or consignment for the unrighteous."<sup id="fnref3"><a href="#fn3">3</a></sup> The dual-compartment idea is best seen in Luke 16:19–31, where Jesus describes the rich man in the side of torment in Hades, and Lazarus in Abraham's bosom, separated by a great chasm. The biblical context of the realm of the dead sets the stage for the death, burial and descent of Christ.</p>
        <p>Scripture teaches that Christ truly died, so His body was buried and His soul descended to the place of the dead. Emerson writes, "He experienced death as all humans do: his body was buried, and his human soul went ('descended') to the place of the dead. He descended to the righteous compartment of the dead ('paradise,' Lk 23:43)."<sup id="fnref4"><a href="#fn4">4</a></sup> Christ's death was a true death, prophesied in Scripture, as Peter in Acts 2:25–28 quotes from Psalm 16: "You will not forsake my soul to Hades, nor give your Holy One to see corruption" (Acts 2:27; Ps 16:10).<sup id="fnref5"><a href="#fn5">5</a></sup> David hopes in the resurrection of Yahweh's Holy One who would not be abandoned in Hades or see corruption but ascend to the right hand of God (Ps 16:11). Psalm 16 and Acts 2 demonstrate that Jesus descended, but did not remain in Sheol, as He was raised from the dead, body and soul, on Sunday. Jonah enacts this pattern of death, descent, and resurrection. He is swallowed by the great fish for three days and three nights (Jon 1:17), cries out to God from Sheol (2:2) separated from God (2:4), and views himself as brought up from the pit (2:6). His prayer to God is from the womb of the fish, and this "pregnant" fish vomits him onto dry land, giving Jonah new resurrection life.<sup id="fnref6"><a href="#fn6">6</a></sup> Jesus declares that Jonah is a sign, and as Jonah threw himself overboard to die, descended into the fish ("Sheol" Jon 2:2) and rose from the fish in three days and nights, so Jesus will be in the heart of the earth (Sheol) for three days and three nights (Matt 12:40). As John Woodhouse summarizes, "The primary meaning of the 'sign of Jonah,' then according to Matt 12:40 is... the correspondence between Jonah's experience in the belly of the sea creature, and Jesus' experience in death, his descent into Hades."<sup id="fnref7"><a href="#fn7">7</a></sup> Christ died, was buried, and descended into Sheol. God did not abandon His soul to Sheol or allow Him to see corruption but raised Him from the dead the next day.</p>
        <p>Paul describes the descent of Christ through His use of Psalm 68 and Isaiah 14 in Ephesians 4:8–10: "Therefore it says, when He ascended on high, He led captive a host of captives, and He gave gifts to men.; Now this expression, 'He ascended;' what does it mean except that He also descended into the lowest parts of the earth? He who descended is Himself also He who ascended far above all the heavens, so that He might fill all things." Paul directly quotes from Psalm 68, where David rejoices over the ascension of the ark of God up Mount Zion and looks forward to the Messianic King ascending God's mountain in triumph (68:18).<sup id="fnref8"><a href="#fn8">8</a></sup> Christ ascended on high in victory but as Paul clarifies, before Christ ascended, he descended into the "lowest parts of the earth" (4:9). Some suggest these regions are simply the earth itself, in contrast to heaven, and that Paul is referencing the incarnation. However, "the incarnation interpretation appears to rely on assuming Paul in Ephesians has a two-tiered, not three-tiered, cosmology," and Paul explicitly includes all three tiers in Romans 10:6–7 and Philippians 2:10, where he follows the common Jewish, Greek, and Roman understanding of Sheol/Hades as the underworld.<sup id="fnref9"><a href="#fn9">9</a></sup> The "lowest parts of the earth" should be understood as the underworld—the realm of the dead.<sup id="fnref10"><a href="#fn10">10</a></sup> This is further confirmed by examining Isaiah 14, the other text Ephesians 4:8–10 alludes to, where the morning star who said he would ascend to heaven (Is 14:13) and make himself like the Most High (14:14) is caused to descend to Sheol and the pit (14:15).<sup id="fnref11"><a href="#fn11">11</a></sup> Paul draws a contrast between the morning star (commonly identified with the Devil), who sought to ascend yet was driven down to Sheol, and Christ, who descended to Sheol and ascended far above all. Whereas Christ follows the trajectory of Jonah in his descent and ascent, He reverses the trajectory of the morning star. Peter describes Christ's interaction with the morning star and his companions in Sheol.</p>
        <p>Peter writes, "For Christ also suffered for sins once for all, the righteous for the unrighteous, so that He might bring you to God, having been put to death in the flesh, but made alive in the spirit; in which also He went and made proclamation to the spirits now in prison, who once were disobedient, when the patience of God kept waiting in the days of Noah" (1 Pet 3:18–20a). Here, Peter intersperses his discussion of Christ's death and salvation through baptism and the ark with a description of the descent, which is followed by the resurrection and ascension (see table 1). Peter clearly locates the descent within the chronology of Christ's death, resurrection, and ascension, paralleling the trajectory of Psalm 16, Jonah in the great fish, and Ephesians 4. He explains that Christ descended to make proclamation to imprisoned spirits and does so to declare "Christ's victory over demonic spirits after his death and resurrection."<sup id="fnref12"><a href="#fn12">12</a></sup> This is seen by comparing the text with 2 Peter 2:4–5, where Peter says God "did not spare angels who sinned, but cast them into the pit and delivered them to chains of darkness, being kept for judgment" and likewise did not spare the world of Noah (cf. Jude 6). Further, Emerson notes the only place besides 1 Peter 3:19 where prison (φυλακή) and spirits (πνεύματος) are used together is Revelation 18:2, where the referent is imprisoned evil spirits.<sup id="fnref13"><a href="#fn13">13</a></sup> In 1 Peter 3:19, as Peter Davids writes, there is seen "a proclamation of judgment by the resurrected Christ to the imprisoned spirits, that is, the fallen angels, sealing their doom as he triumphed over sin and death and hell, redeeming human beings."<sup id="fnref14"><a href="#fn14">14</a></sup> The descent then seems to mark not just Christ's humiliation (in so far as it is a consequence of death), but also the start of His exaltation.</p>
        <p>Christ's descent is a victorious descent. Building on Peter, Emerson calls the descent, "the first of three stops on Jesus' victory tour: first he proclaims victory in the realm of the dead, then he proclaims it in the realm of the living, and... in the heavenly realm. In other words, the descent begins Christ's exaltation through the universe's three tiers: the underworld, the earth, and the heavens" (cf. Phil 2:10).<sup id="fnref15"><a href="#fn15">15</a></sup> It may seem strange that victory would be proclaimed through the descent, but not when the descent is read in connection with the resurrection and ascension. This is indeed how Ephesians 4 and 1 Peter 3 both present the descent. Christ is the one who can die and descend into the abyss and then rise and ascend into the heavens (Rom 10:6–7). Christ's descent marks an aspect of His victory, as the descent shows that He really and truly died. It is through His death that He defeats the one who held the power of death the devil (Heb 2:14). Thus, it is entirely appropriate for the dead Christ to descend and immediately proclaim His victory over the imprisoned spirits. Christ truly died and descended, which makes His rising and ascension all the more glorious of a victory. He proclaims "this victory, achieved through his death, descent, and impending resurrection, to all the dead, righteous and unrighteous, and to the disobedient angels. Christ's descent, in other words, is primarily part of his exaltation, not his humiliation."<sup id="fnref16"><a href="#fn16">16</a></sup> Christ defeats death through His resurrection and ascends as the victorious king into heaven. His "obedience even to death is the cause of His exaltation and His universal sovereignty not only over the heavenly and the earthly, but over.. those under the earth."<sup id="fnref17"><a href="#fn17">17</a></sup> The descent does mean that Christ really and truly died, defeated the demonic powers, and rose from the realm of the dead in victory. Believers are united with Christ in his death, descent, and resurrection, so as Christ was not abandoned to Sheol, neither will His people be abandoned. Instead, believers dwell in the presence of the risen and victorious Christ.</p>

        <h2 id="the-descent-defended">The Descent Defended</h2>
        <p>The church has held to a variety of views on the descent throughout history. Most versions of the Apostle's and Athanasian Creeds have contained the clause "he descended into hell" or "he descended to the dead ones." Different views arose in the church as to how to understand the creeds and texts such as Psalm 16, Ephesians 4:8–10, and 1 Peter 3:19. While the doctrine of the descent has not been formally denied in church history, differing understandings of it have led to a distortion of other doctrines, or a reduction of the descent into something less than what Scripture teaches. The following section will examine the salvific or universalist understanding of the descent and the notion of the descent as Christ's suffering on the cross.</p>
        <p>The early church emphasized that Jesus descended to the dead as a natural result of His death.<sup id="fnref18"><a href="#fn18">18</a></sup> Justin Bass summarizes, "In the second century, the threefold purpose of Christ's journey to the underworld are already defined as a preaching tour, releasing the saints of the Old Testament, and a triumphant defeat of Death and Hades."<sup id="fnref19"><a href="#fn19">19</a></sup> Nearly all of the church fathers saw the descent as a rescue mission to set the OT saints free from prison.<sup id="fnref20"><a href="#fn20">20</a></sup> Many following the church fathers affirmed that Christ's preaching in the underworld (drawn from 1 Peter 3:18–22) was preaching not just in triumph over demons, or of victory to believers, but evangelistic preaching to dead souls. Clement of Alexandria and Augustine speculated in this direction<sup id="fnref21"><a href="#fn21">21</a></sup> and many within the Eastern tradition appear to hold to a sort of universalism tied to Christ's descent.<sup id="fnref22"><a href="#fn22">22</a></sup> The concepts of evangelistic preaching, a second chance for the dead, or any notion of universalism should be soundly rejected. Gregory the Great delivered a stern rebuke to a presbyter who drifted in this direction: "Hold ye nothing but what the true faith teaches through the Catholic Church: namely, that the Lord in descending into hell rescued from infernal durance those only whom while living in the flesh He preserved through His grace in faith and good conduct... For one could not be drawn to God after death who had separated himself from God by evil living."<sup id="fnref23"><a href="#fn23">23</a></sup> Note that Gregory does not deny the doctrine of the descent, but corrects erroneous implications drawn from it. The idea of salvation or a second chance for the unbelieving dead should be and has been soundly rejected throughout history. As Emerson summarizes, "Biblically speaking, a universalist understanding of the descent via either a postmortem offer or a complete destruction of Hades is not an option, either. The writer of Hebrews reminds us that, 'it is appointed for man to die once, and after that comes judgment' (Heb 9:27)."<sup id="fnref24"><a href="#fn24">24</a></sup> The descent must not be used to teach the salvation of the dead, in part or in whole. The preaching in Christ's descent is not to saints or to unbelievers, but to the disobedient spirits in prison (1 Pet 3:19).<sup id="fnref25"><a href="#fn25">25</a></sup> This should be understood as the proclamation of Christ's victory under the earth, a shout of triumph over the imprisoned spirits.</p>
        <p>The Reformed tradition, following Calvin, largely drifted away from a geographic understanding of Holy Saturday. The Westminster Confession and the Three Forms of Unity all articulate an understanding of Christ's body being buried and his soul suffering the wrath of hell on the cross but ascending into heaven upon his death. Calvin understood the descent as "an expression of the spiritual torment that Christ underwent for us."<sup id="fnref26"><a href="#fn26">26</a></sup> Petrus van Mastricht describes the descent of Christ's soul "not into a place, but into the infernal state, wherein he experienced infernal things, or infernal punishments, in his soul."<sup id="fnref27"><a href="#fn27">27</a></sup> Question 44 of the Heidelberg Catechism follows this understanding, calling the descent "suffering unspeakable anguish, pain, and terror of soul, on the cross but also earlier." Van Mastricht and Calvin cite texts such as Psalm 18:5 and Psalm 30:1–3 that describe being in a state of anguish as being in Sheol. However, this does not necessitate reducing the meaning of Christ's descent to His suffering on the cross. This association of Christ's suffering on the cross with the descent was largely unheard of prior to the Reformation.<sup id="fnref28"><a href="#fn28">28</a></sup> The reduction of the descent to Christ's suffering and burial by the Reformed tradition largely stems from objecting to the Roman concept of Christ freeing the saints from limbo. However, the caution against limbo or a spatial harrowing of hell goes too far in reducing the concept of descent to suffering in the soul. The structure of 1 Peter 3:18–22 (see above and table 1) plainly divides the descent from Christ's death. There is a clear progression in the description of 1 Peter 3 and in the sign of Jonah: Christ died, then descended, then rose from the dead. Further, 1 Peter 3 and Ephesians 4:9–10 give no indication of Christ's suffering in the descent. Readers of Scripture would do well to follow the trajectory of Scripture in affirming Christ's death, burial, descent, resurrection, and ascension.</p>

        <h2 id="the-descent-applied">The Descent Applied</h2>
        <p>Scripture presents Christ's descent, not as a rescue mission or a second chance for the faithless, but as an essential part of His true death and the start of His triumph. In His death and descent, He defeats the one who held the power of death (Heb 2:14), entering the strong man's house and binding Him (Matt 12:29). In the realm of the dead He announces His victory over the imprisoned spirits (1 Pet 3:19) and He says now to His church, "Do not fear; I am the first and the last, and the living One; and I was dead, and behold, I am alive forever and ever, and I have the keys of death and of Hades" (Rev 1:17–18). The believer has no need to fear death or the powers of evil because Christ has triumphed over them. Because Christ died, descended, rose, and ascended, the Christian can die with assurance that they will be in the presence of the victorious Christ. If the descent and the rest of Christ's work mean one has nothing to fear in the life to come, then they can also walk confidently in this life. When the trials of life feel like walking through the valley of the shadow of death, the believer can be confident with David that Christ is with them, because Christ descended into the shadow of death. As van Mastricht writes, "Whenever our souls descend into the horrors of hell... what then is more effective than to think that Christ also descended, and that not for himself, but for his own, and just as God did not leave him in hell, so also, on account of him, he will not abandon them?"<sup id="fnref29"><a href="#fn29">29</a></sup> Christ entered the realm of the dead among those who looked forward to His coming, and they now dwell in His presence. If Christ did not abandon His own to Sheol, then He will certainly never abandon us in this life. There is no greater image of Christ's descent and comforting presence than His descent into the blazing furnace which caused Nebuchadnezzar to cry: "Behold, I see four men loosed and walking about in the midst of the fire without harm, and the appearance of the fourth is like a son of the gods." (Dan 3:25). Christ who died, descended, and rose on behalf of His people still says to them: "Do not fear, for I have redeemed you; I have called you by name; you are mine... When you walk through the fire, you will not be scorched, nor will the flame burn you" (Is 43:1–2). Christ has defeated evil and death, walks with us through this life, and will raise us from the realm of the dead in the life to come.</p>

        <h2 id="introduction">Introduction</h2>
        <p>The Epistle to the Hebrews is a sermonic exhortation to enter the Sabbath-rest by focusing on our superior high priest. In his two main directives, the author urges believers to "Consider the apostle and high priest of our confession—Jesus" (Heb 3:1) and to be "fixing our eyes on the beginner and finisher of our faith—Jesus" (12:2).<sup id="fnref1"><a href="#fn1">1</a></sup> The first exhortation comes at the end of a beautiful declaration of Christ's superiority over every created being (1:1-3:6), while the second follows an examination of faith throughout redemptive history (11). Christians are to trust in Jesus, their great high priest, and rest in his intercession and completion of their faith. Jesus is the Messianic priest-king of Psalm 110 and the object of the faith of the righteous man in Habakkuk 2:4, which serve as the two anchor texts for Hebrews. The reward of the Christian who perseveres by faith in the high priest is God's Sabbath rest. In Hebrews 3-4, the author expounds on Psalm 95, where David reflected on the wilderness generation. While Israel of old failed to enter the rest because of unbelief, the Israel of God must press on to enter his remaining rest by faith in the high priest.</p>

        <h2 id="context">Context</h2>
        <p>Hebrews 1:1-3:6 focuses on the superiority of Christ. The opening of chapter three begins to move to the author's next great theme, as he opens with a transition and nominative of direct address Ὅθεν, ἀδελφοὶ ἅγιοι ("so then, my beloved brethren").<sup id="fnref2"><a href="#fn2">2</a></sup> He demonstrates Christ's superiority one more time in vv. 2-5 to reinforce his primary imperative, κατανοήσατε ("consider"), from v. 1. His transition is completed in v. 6, as he moves from Christ's faithfulness as a son over his house, to our faithfulness as Christ's house. We are his house, true believers, "if we hold fast (κατάσχωμεν) our confidence and the boast of our hope" (3:6). Those who do not hold fast are like the wilderness generation (3:7-19) and are thus not God's house. Those who do hold fast will enter God's Sabbath rest (4:1-13) and be his house for eternity. The author repeats the main subjunctive in v. 3:14, declaring that "we have become participants in Christ if we hold fast (κατάσχωμεν) the beginning of our assurance firm until the end." The difference between entering and being barred from God's rest is whether the individual holds fast to his hope. The hearts of Israel fainted in the wilderness and they forsook their confidence in God. They tested him instead of confessing him. The recipients of Christ's rest are those who hold fast to their confidence, hope, and assurance (3:6, 14).</p>
        <p>The author shows what will happen if his readers do not hold fast—they will fail to enter the rest like the wilderness generation (3:7-19). Westfall helpfully summarizes that while 3:1-4:1 focuses on the readers' identity and danger in hardening their hearts to Jesus' message, 4:1-13 focuses on the reality of the readers' opportunity in responding positively to Jesus' message.<sup id="fnref3"><a href="#fn3">3</a></sup> In 4:1-13, the author exhorts the readers to enter the remaining sabbath rest through faith, for the message of God is a double-edged sword, and they must decide how to respond to it (4:1-13). Hebrews 4:1-13 is about the Christian's response to Psalm 95 and the disobedience of the wilderness generation. The question is: Will they be unbelieving and fall short (3:19) or believe and enter the rest (4:3)?</p>

        <h2 id="outline">Outline</h2>
        <p>Hebrews 4:1-13 opens with a subjunctive declaration, supported by two indicative statements (4:1-3a). The author next dives into a theology of the Sabbath, proving that a Sabbath rest remains for God's people (4:9) because the rest existed from the world's foundation (4:3b-4), the rest endures for some to fail and some to enter (4:5-6a), disobedience bars entry (4:6b), the rest is for today (4:7), and Joshua spoke of it (4:8). He then defines the Sabbath rest as a rest from works (4:10) and arrives at his main exhortation: we must press on to enter into that rest (4:11). Finally, he adds an additional reason to press on by two statements about God's message—it is a double-edged sword, and the message is given to us (4:12-13).</p>

        <h2 id="opening-exhortation">Opening exhortation (4:1-3a)</h2>
        <p>The opening call of Hebrews 4:1-13 returns the reader to the present age. Having exposited Psalm 95 and declaring that the wilderness generation, "did not enter because of unbelief" (3:19), the author brings application to his readers with a hortatory subjunctive, "Therefore, we must be fearful" (Φοβηθῶμεν οὖν).<sup id="fnref4"><a href="#fn4">4</a></sup> As Westfall comments, while the following unit in 4:1-13 is set apart structurally by the occurrence of the hortatory subjunctive, it has many cohesive ties with 3:1-4:1.<sup id="fnref5"><a href="#fn5">5</a></sup> The failure of the wilderness generation to enter the Sabbath rest is a cause for alarm among lackadaisical Christians. He has already applied the warning of Psalm 95 to the church, writing, "Today if you hear his voice, do not harden your hearts as in the rebellion" (3:15). The readers must not be hard of heart, but fearful, for if some fell before, some may fall again. The new covenant community are partakers of Christ only if they hold fast to him (3:14). If they do not hold fast, they too may fail to enter because of unbelief (3:19). This is cause for a holy fear. Calvin pastorally comments that the fear here recommended is not that which shakes the confidence of faith, but such as fills us with concern that we grow not torpid with indifference.<sup id="fnref6"><a href="#fn6">6</a></sup> The fear the author commands should stir the reader to enter God's rest, and there is good reason for this fear.</p>

        <h3>Reason: The possibility of not entering the rest (4:1b)</h3>
        <p>The new covenant community is called to fear since a promise of entering the rest remains, but some may fall short of it. The reader should take some encouragement, as "a promise remains of entering into his rest." Within the genitive absolute construction, καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ, the author uses the present participle καταλειπομένης to emphasize the present and continuing nature of the promise.<sup id="fnref7"><a href="#fn7">7</a></sup> The promise is still in effect—God's people will enter his rest. Since the promise remains, the possibility of falling short of the promise also remains. The infinitive ὑστερηκέναι is in the perfect tense,<sup id="fnref8"><a href="#fn8">8</a></sup> to mark not only a present or past defeat but an abiding failure.<sup id="fnref9"><a href="#fn9">9</a></sup> Those who fall short of the promise while it remains are left in that state. Kleinig says the picture is of a lagging traveler who does not keep up with his companions and so fails to reach the destination of their journey.<sup id="fnref10"><a href="#fn10">10</a></sup> The picture applies well to both the wilderness generation and the generations of the new covenant.<sup id="fnref11"><a href="#fn11">11</a></sup></p>

        <h3>One message (4:2a)</h3>
        <p>The promise of entering God's rest remains which demonstrates that Canaan was not the final resting place. The hope for the Hebrews is not Canaan, but God's eternal Sabbath rest as the author will extrapolate in this text. Bruce writes that the meaning of that "rest" was not exhausted by the earthly Canaan which was entered by the Israelites of the generation which had grown up to manhood in the wilderness; the spiritual counterpart of the earthly Canaan is the goal of the people of God today.<sup id="fnref12"><a href="#fn12">12</a></sup> The rest (κατάπαυσιν) which the wilderness generation was barred from (3:11, 18) can and must be entered by the covenant community today (4:1). Israel fell short of the earthly κατάπαυσιν but the church must not fall short of the eternal κατάπαυσιν. Israel and the church have the same good news proclaimed to them (4:2). The passive participle, εὐηγγελισμένοι ("good news proclaimed") is the message (ὁ λόγος) of entering God's rest.<sup id="fnref13"><a href="#fn13">13</a></sup> The wilderness generation was called to enter the rest, as David called the Israel of his day in Psalm 95. As Westcott writes, the Israelites in the wilderness and the first Christians were in the same position.<sup id="fnref14"><a href="#fn14">14</a></sup> Where Israel failed to enter God's rest, the church must be fearful and not fall short of the promise. Those in the church who do not enter it while the promise remains are like the generation dying in the wilderness, outside of the promised land. Adam stood outside of Eden, and Israel stood outside of Canaan, so the readers are encouraged to persevere and enter the promised rest. The difference between Israel and the church is not the message, but the hearers.</p>

        <h3>Unbelieving hearers (4:2b)</h3>
        <p>The church and Israel both had good news proclaimed (εὐηγγελισμένοι) to them, "but the message that was heard did not profit" (ἀλλʼ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς). The message, the promise of entering the rest (4:1) was not profitable, but not because of any flaws in the message itself. The message did not profit "the ones who have not been united with those who heard in faith" (4:2). The Greek text is rather ambiguous and has a textual question. The NA 28/UBS 5 and the THGNT read ὁ λόγος τῆς ἀκοῆς ἐκείνους μὴ συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν. The reading μὴ συγκεκερασμένους<sup id="fnref15"><a href="#fn15">15</a></sup> ("the ones who have not been united") takes the participle as referencing a generation who were not in unison with the faithful. There are several alternatives to this reading, of which the most common is συγκεκερασμένος,<sup id="fnref16"><a href="#fn16">16</a></sup> which would modify ὁ λόγος. Thus, the text would say that the word was not united with faith in its hearers. The accusative plural συγκεκερασμένους is the more difficult reading, which along with manuscript evidence, is why the critical texts adopt it. Metzger comments that συγκεκερασμένους is supported by early and diverse testimony representing both the Alexandrian and the Western types, and as the more difficult reading it would naturally have been altered to the easier nominative singular.<sup id="fnref17"><a href="#fn17">17</a></sup> Taking the reading συγκεκερασμένους, the reference is to the wilderness generation not being united with the ones who heard in faith.</p>

        <h3>Believing hearers (4:3a)</h3>
        <p>The believing hearers are "the ones who heard with faith" (τῇ πίστει τοῖς ἀκούσασιν). The substantival participial τοῖς ἀκούσασιν is paired with τῇ πίστει to show how the message was heard. The ones who fell short of entering God's rest, the wilderness generation described in 3:7-19, were not united with the ones who heard with faith. The identity of the believing hearers in v. 2 is sometimes speculated to be Moses, or Joshua and Caleb.<sup id="fnref18"><a href="#fn18">18</a></sup> However, the text makes their identity clear in the next phrase, "For we—the ones who believe—enter into that rest" (εἰσερχόμεθα γὰρ εἰς [τὴν] κατάπαυσιν οἱ πιστεύσαντες). The generation of old is not united (μὴ συγκεκερασμένους) with the ones who heard with faith (τῇ πίστει τοῖς ἀκούσασιν), namely the ones who believe (οἱ πιστεύσαντες). Attridge aptly summarizes that the author is not saying that the ancient Israelites were not united to the faithful remnant, Caleb and Joshua, who heard the message; rather, he says they were not united to "us" who do, he hopes, listen to the message.<sup id="fnref19"><a href="#fn19">19</a></sup> The wilderness generation is not united with the believing generation of the new covenant. As the author concluded at the end of chapter 3, "they were not able to enter because of unbelief" (3:19). Their unbelief (ἀπιστίαν; 3:19) is contrasted with those who heard in faith (τῇ πίστει; 4:2) and are thus called "the believing ones" (οἱ πιστεύσαντες; 4:3). Those who do not believe fail to enter the rest, and so they have not been united with the ones who heard with faith (4:2). The believers "enter into the rest" while the unbelievers do not, as God swore in his wrath, "they will never enter into my rest" (4:3). The unbelievers and believers are not united, because one enters the rest, while the other falls short. The author next describes these two destiny verses as part of his exhortation from 4:1 to not fall short of the rest.</p>

        <h2 id="theology-of-the-rest">Theology of the rest (4:3b-10)</h2>
        <p>After urging the readers, the ones who believe, to enter the rest, the author then lays out a theology of the remaining Sabbath rest for God's people. Those who were not united with the believers were barred from the rest, but those who are fearful and persevere in faith will receive entry.</p>

        <h3>Edenic rest (4:3b-4)</h3>
        <p>The rest that Israel fell short of, but those who believe will enter, is Edenic. The Lord swore in Psalm 95, as quoted in v. 3, that the wilderness generation would never enter into his rest. Now the verse concludes by showing that he was not to blame for their failed entry. They were barred from the gate to rest, "and yet the works have been finished from the foundation of the world" (καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων). "And yet" translates καίτοι (και + τοι) which is a concessive conjunction and serves to introduce the theological point made in v. 4.<sup id="fnref20"><a href="#fn20">20</a></sup> Following the conjunction, the author uses a genitive absolute construction, with γενηθέντων as the participle modifying τῶν ἔργων. The genitive absolute is functioning temporally, emphasizing that the works have been finished from the foundation of the world. According to Kleinig, the article before εργων implies possession, "his works" — this genitive absolute concedes that entry into God's rest has been possible ever since the completion of God's works.<sup id="fnref21"><a href="#fn21">21</a></sup> The works of God have been finished from the foundation of the world. As Lane puts it, God's rest consists in the completion of his works, and consequently his rest has been in existence since the foundation of the world.<sup id="fnref22"><a href="#fn22">22</a></sup> The unbelieving generation failed to enter the rest despite God's works being completed. The completion of those works is then explained in the next verse.</p>
        <p>The author uses an indefinite introduction to a familiar text, "For he says somewhere concerning the seventh, in this way," (εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως). This indefinite way of introducing a quotation is unique to here in the NT but is used in other ancient Greek texts.<sup id="fnref23"><a href="#fn23">23</a></sup> The quotation, "and God rested on the seventh day from all his works" (Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ), from Genesis 2:2 serves to demonstrate the truth of the concession—that his works have been finished from the foundation of the world (4:3). The author follows the LXX in his quotation, except for inserting ὁ θεὸς to make the subject explicit. God rested on the seventh day in order to establish that seventh day as Sabbath. On the seventh day, God rested from all his works, creating a perpetual state of rest. God finished creation by creating a Sabbath-rest, and so the divine rest was prepared: God himself had entered into it, though it still remained that his people should share it according to his purpose.<sup id="fnref24"><a href="#fn24">24</a></sup> However, those people do not enter that rest.</p>

        <h3>Future rest (4:5-6a)</h3>
        <p>The author reintroduces the Psalm 95:11 quotation in v. 5, "And in this again, they shall never enter into my rest" (καὶ ἐν τούτῳ πάλιν, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου). God's rest began from the foundation of the world (4:3), on the seventh day of creation (4:4). The wilderness generation did not fail to enter because of any fault of the rest. The rest predated them and continued to exist after them. Bruce summarizes that it was not because the "rest" of God was not yet available that the wilderness generation of Israelites failed to enter into it; it had been available ever since creation's work was ended.<sup id="fnref25"><a href="#fn25">25</a></sup> The homiletic force of vv. 3-5 is clear: Israel did not fail to enter the rest because of God or the rest itself. The rest has been available from the end of the creation week. Their failure to enter is because God swore that they should never enter (4:3, 5). The reason for his oath was already made explicit, "They did not enter because of unbelief" (3:19). Allen writes that although God's works were completed and the rest available, yet they did not enter into it — the expectation was that they should have entered.<sup id="fnref26"><a href="#fn26">26</a></sup> The sole reason for Israel's failure to enter was their unbelief. Yet their unbelief does not make the rest unattainable for all. The purpose of Hebrews 3:7-4:13 is to urge the readers to not be like the wilderness generation but to press on to enter the true and better land of Canaan.<sup id="fnref27"><a href="#fn27">27</a></sup> This is seen in the nature of the rest.</p>
        <p>As demonstrated above, vv. 3-4 show that God's rest is intimately tied to the Sabbath. God's rest was established on the seventh day, existing from the foundation of the world. The land of Canaan was a resting ground on the way, but it was not the ultimate place of rest. Kleinig writes that this rest is not the promised land or the temple as God's place of rest; it is God's primordial time and place of rest, which he established when he founded the world and which he entered when he had completed his creative works on the seventh day.<sup id="fnref28"><a href="#fn28">28</a></sup> God's rest existed before the promised land, before the temple, before the church. It is the perfection of creation, established before the fall, and it is the destiny of those who believe (4:3). The author of Hebrews returns to Eden because the rest that lay before the wilderness generation, and that lies before the new covenant church, is the seventh-day rest of the creation.<sup id="fnref29"><a href="#fn29">29</a></sup> The rest was established at creation and continues throughout the history of creation. This rest is still future for the readers of the epistle. Israel failed to enter and was barred from ever entering (4:3, 5). The need for a prohibition shows that the possibility of entrance still stands. The rest was before and is after their failure. It is an abiding eternal rest, and the author uses Israel's failure to urge his readers to press on.</p>
        <p>The author begins one sentence that spans vv. 6-7 by tying it to the previous, "Therefore, since it remains for some to enter it" (ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν). He uses the postpositive οὖν to show that his next statement is a result of the two quotations in vv. 4-5. As a result of God resting on the seventh day and swearing that the wilderness generation failed to enter his rest, it remains for some to enter it. The Sabbath predated Israel's failure, so it is not done away with by their falling short. The rest has been established, so it remains for some to enter it. The indefinite pronoun τινὰς shows that this entry goes beyond the readers of the epistle. In accordance with v. 3 ("we who believe enter into that rest") the author uses τινὰς to show that a variety of people, and a great number of them, will enter God's rest. Israel's unbelief does not negate the existence of a future entry.</p>

        <h3>Past failure to enter (4:6b)</h3>
        <p>Functioning as a marker of cause, the conjunction ἐπεὶ that opens v. 6 governs both halves of the verse. The two phrases, "it remains for some to enter into it and the ones who formerly had good news preached to them did not enter because of disobedience" are the dual cause of the author's following declaration in v. 7. The second phrase under ἐπεὶ returns to the theme of 3:19. There is a rest that has been established, and it remains for some to enter it, but there was a group that fell short before. This group formerly had good news preached to them (οἱ πρότερον εὐαγγελισθέντες). The aorist passive participle εὐαγγελισθέντες<sup id="fnref30"><a href="#fn30">30</a></sup> was used in the perfect in v. 2 (εὐηγγελισμένοι) to describe both the wilderness generation and the church. Here the aorist participle modifies the verb εἰσῆλθον ("they did not enter").<sup id="fnref31"><a href="#fn31">31</a></sup> They were preached to, but they did not enter the rest. There is no room for finding fault with the rest, for it was already established (4:3-4), nor with a lack of a message, for the message was preached and heard (4:2, 6). The reason for that generation's falling short was their unbelief (ἀπείθειαν). The two reasons are paralleled with the preposition and the alpha-privative, διʼ ἀπιστίαν (3:19) and διʼ ἀπείθειαν (4:6). The rest was held from that generation because of their unbelief and disobedience. In this way, they serve as a warning to the church.</p>
        <p>Israel was disqualified from the physical land of rest because of their unbelief and disobedience. Their refusal to enter the rest is a crucial part of the author's caution to not fall short of the rest. Unbelieving Israel being kept from the promised land is a foreshadowing of how all who are unbelieving and disobedient will be kept from God's eternal rest. Kleinig captures this relation well: God's disqualification of the faithless from entry into the promised land, which was gained by those who believed God's Word of promise, prefigures the present exclusion of unbelievers and the entry of the faithful into his heavenly rest.<sup id="fnref32"><a href="#fn32">32</a></sup> The wilderness generation did not believe, and so fell short of the land of physical rest. Their unbelief likewise kept them from God's eternal rest, of which the land of Canaan was only a type. In like manner, all who are unbelieving and disobedient will fall short of God's rest. Those who fail to enter among the readers of the epistle will find themselves in the same place as the generation who died in the wilderness.</p>
        <p>Many fail to enter God's rest because of unbelief and disobedience (3:19; 4:6). Yet God did not establish his rest in vain. Since (ἐπεὶ) it remains for some to enter and those who had the message preached did not enter, there must be a new generation of participants in God's rest. The door to God's rest did not close in the wilderness. Since the rest is awaiting entry, God appoints a new day.</p>

        <h3>Present hope of entry (4:7)</h3>
        <p>Since it remains for some to enter, and Israel did not enter because of disobedience, God appoints a new today of entry. For the third time (3:7, 15) the author quotes from Psalm 95:7. This time, the quotation is subordinate to ἐπεὶ οὖν (4:6) and is introduced, "Again he appoints some day, 'Today,'" (πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον). "Again" (πάλιν) is subsequent to the first appointing of a day of rest. In the thematic context, the prior appointment would be Moses calling Israel to enter the promised land. In the literary context, the prior appointment would likely be the establishment of the Sabbath day (4:3-4). Regardless, the point stands that by the word "Today" in Psalm 95, God is again appointing a day of entry into his rest. He does so, "saying by David after a long time, just as it has been said before" (ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς προείρηται). The message of Psalm 95 is not just a condemnation, as it was so quoted in 3:7-11, but a message of hope. Allen captures the hope in v. 7, writing that the promise of rest was still available in the time of David, hundreds of years after the exodus generation's failure to enter the rest.<sup id="fnref33"><a href="#fn33">33</a></sup> A new day of entry has been appointed, so David declared, "Today if you hear his voice, do not harden your hearts" (Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν). The wilderness generation hardened their hearts against God and failed to enter the physical rest. David used them as an example to warn the generation of his day to not fail to enter God's spiritual rest. According to Bruce, a later generation of Israelites was warned by the psalmist not to follow the bad example of their ancestors' refusal to listen to God, lest disaster should overtake them in turn; and now a still later generation has the same warning impressed upon it by the writer to the Hebrews.<sup id="fnref34"><a href="#fn34">34</a></sup> The author of Hebrews takes the warning that David uses in his day and appropriates it for his readers. However, David's words in the context of the eternal rest in ch. 4 raise a question: If Israel was kept from the physical rest under Moses, but the second generation did enter the promised land under Joshua, why does David still say "Today"?</p>

        <h3>Future entry (4:8)</h3>
        <p>Here the author brings out a logical inference from Psalm 95 that he has not attested to in his prior quotations of the text (3:7, 15). David's exhortation to not be like the wilderness generation is not merely a command to not be hard-hearted or rebellious in general. David specifically has God's rest in view, a rest beyond the land of Canaan. After the death of the wilderness generation, their children entered the land of Canaan under the leadership of Joshua. Why then does David issue a warning? The author of Hebrews explains, "For if Joshua had caused them to rest, he would not have spoken concerning another day after these things" (εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας). Verse 8 opens with a first-class conditional statement, marked by ει plus the indicative (κατέπαυσεν), assuming the reality of the condition. If Joshua had actually brought Israel into the final resting place, then David would not speak of another day. Therefore, Joshua did not ultimately cause Israel to rest (κατέπαυσεν).<sup id="fnref35"><a href="#fn35">35</a></sup> He brought them into the land of Canaan, but that was not the ultimate resting place.</p>
        <p>The author makes the relation between the earthly and heavenly rests clear here in v. 8. Bruce says of the readers that the heavenly rest which lies before them is the counterpart to the earthly Canaan which was the goal of the Israelites.<sup id="fnref36"><a href="#fn36">36</a></sup> Theologically, Calvin says the land of Canaan was not otherwise so much valued except for this reason, because it was an image and a symbol of the spiritual inheritance.<sup id="fnref37"><a href="#fn37">37</a></sup> Canaan is not the rest the author of Hebrews is exhorting his readers to enter, but rather, as Kistemaker words it, the rest of which God speaks is a spiritual rest and has much greater significance than living safely in Canaan.<sup id="fnref38"><a href="#fn38">38</a></sup> The land of Canaan was a true inheritance, a true resting place. However, Israel was meant to look beyond the land of Canaan and press on toward God's eternal Sabbath rest. Although in a place of rest, Calvin says, in a sense they ought not to have rested as though they had attained to the summit of their wishes, but on the contrary to meditate on what was spiritual as by it suggested.<sup id="fnref39"><a href="#fn39">39</a></sup> The Israel of David's day was living in that land of rest, so Psalm 95 is urging them to look beyond it and meditate on what was spiritual. The author of Hebrews does the same for his audience.</p>
        <p>The unbelieving and disobedient wilderness generation did not enter the earthly rest. The conquest generation did not inherit the final rest. The generations following failed to look beyond the land of Canaan to the heavenly rest. So, the author summarizes his theology of the rest (4:3b-10) with a bold declaration: the rest remains.</p>

        <h3>Remaining rest (4:9-10)</h3>
        <p>The high point of the author's theological treatise of God's rest occurs in verse 9, as marked by the inferential conjunction ἄρα.<sup id="fnref40"><a href="#fn40">40</a></sup> The author draws an additional conclusion from the exposition of Ps 95:7b-11 in Heb 3:7-19 in the light of Gen 2:2-3.<sup id="fnref41"><a href="#fn41">41</a></sup> Since the wilderness generation failed to enter the rest and Joshua could not give rest to the conquest generation, "So a Sabbath-rest remains for the people of God" (ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ). The syntax of v. 9 is simple, the conclusion of 4:3b-8 is that a σαββατισμὸς remains for God's people. The word σαββατισμὸς does not exist prior to this in classical Greek, occurs only here in the NT, and commentators agree that it is a term coined by the author. It is a nominalization of the verb σαββατίζω, which appears in seven texts in the LXX.<sup id="fnref42"><a href="#fn42">42</a></sup> To this point the author of Hebrews, following Psalm 95:7, has used the noun κατάπαυσις (and its verbal form καταπαύω) to refer to God's rest and act of resting. This term was even used for the creation of the original Sabbath rest in v. 4. Now in v. 9, the author coins a term to nuance the rest he is describing. God rested, creating the Sabbath rest, and the readers are encouraged to enter his rest. Now the author uses σαββατισμὸς to clarify that the rest God's people enter is his Sabbath-rest. O'Brien helpfully summarizes that the term sabbatismos is not synonymous with katapausis, but explains what takes place in God's resting place, namely, an eternal, festive sabbath celebration.<sup id="fnref43"><a href="#fn43">43</a></sup> The church has been exhorted to enter God's rest, and in v. 9, the author declares that the rest remains and is an eternal Sabbath. Entering the σαββατισμὸς is the believer's participation in God's own rest.<sup id="fnref44"><a href="#fn44">44</a></sup> Those who enter God's Sabbath-rest enjoy fellowship with God and celebrate the Sabbath in his presence. God, in a sense, dwells in this Sabbath, having entered it on the seventh day (4:3b-4). The believer enters into God's dwelling place and in v. 10, enjoys the same quality of rest.</p>
        <p>The believer enters into God's rest and rests in the same way as God does. The author describes the quality of their rest, "For the one entering into his rest also rested from his works, as God did from his own" (ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός). The rest remains for the people of God, so they enter into it. The aorist participle εἰσελθὼν ("entering") is substantival,<sup id="fnref45"><a href="#fn45">45</a></sup> describing one of God's people who faithfully (3:19) and obediently (4:6) enters his Sabbath-rest. The aorist participle is modified by the aorist verb κατέπαυσεν ("rested"), indicating concurrent action.<sup id="fnref46"><a href="#fn46">46</a></sup> The one who enters God's rest rests from his works. Wallace categorizes κατέπαυσεν as a proleptic aorist, describing an event that is not yet past as though it were already completed.<sup id="fnref47"><a href="#fn47">47</a></sup> The final entry into God's rest is future, but it is so certain that the believer will enter, that the author speaks as though he has already rested.</p>
        <p>The believer's rest from his works corresponds with God's. The σαββατισμὸς of v. 9 is not just entry into the place of God's rest, but a quality of rest like that of God's. The one who enters God's rest is in a state of rest from his works, "as God from his own" (ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός). This conclusion is illustrated by the linguistic parallels between verses 4 and 10.</p>
