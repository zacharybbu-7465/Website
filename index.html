          <tr><th>Believer's Rest (4:10)</th><td>καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ</td></tr>
        </table>

        <p>The Sabbath-rest that remains for the believer (4:9) is not just entry into the place of God's rest (4:3) but entry into the quality of rest that God enjoys. The one who enters will enjoy the rest that is necessary for the festivity and praise of a Sabbath celebration.<sup id="fnref48"><a href="#fn48">48</a></sup> As God rested from his works on the seventh day, so the believer will rest from his works when he enters God's seventh-day rest. O'Brien comments on this parallel: whoever enters this eschatological rest will have completed their service on earth, just as God finished his work after creation — the parallelism between the two clauses is striking, the rest is not only God's, it is also the believer's.<sup id="fnref49"><a href="#fn49">49</a></sup> The believer enters God's rest and takes part in it. As God rests, so do all who enter into his rest.</p>
        <p>The believer rests by entering into God's Sabbath-rest and resting from his works. However, the author does not specify what works the believer is resting from. The simplest reading indicates that the believer entering into the eschatological rest of God will have rested from their works from this life. As seen previously, the rest remaining for believers is Edenic, the seventh-day rest of God. In God's eternal Sabbath-rest, the believer enjoys rest from the works of this world. One might object that prelapsarian Adam did in fact work in the garden (Gen 2:15). However, there is a specific dimension to working that is counted as part of the curse (Gen 3:17b-19). Whereas food was abundantly available before, with man merely working and guarding the garden, now after the fall, man suffers and strains himself to grow food from the dust. The curse inflicted on Adam is focused on works. He is exiled from the garden (Gen 3:23-24) and sent to work for his food. In Adam's exile, mankind is exiled; in his work, mankind works; in his death, mankind dies. Works are a part of the curse in the exile of man from the garden. However, the message of Hebrews 4:1-13 is that those who believe will enter God's seventh day Sabbath-rest—that they will return from exile. Adam's exile is reversed as believers enter God's resting place. And as one enters God's Sabbath-rest, he "also rested from his works as God did from his own" (4:10). The believer's rest from works is the reversal of Adam's curse. God rested from his works after the work of creation was finished. The believer rests from his works as the new creation dawns. This contributes to the author's main theological point—that a Sabbath-rest remains. So Leschert writes that the people of God, from all indications, have never rested from their works as God did from his; since God's people have never experienced the rest that was promised to them, the possibility of entering it must remain open in order for the promise to be valid.<sup id="fnref50"><a href="#fn50">50</a></sup> With a rich theology of the Sabbath-resting-place laid out, the author finally turns to his main exhortation.</p>

        <h2 id="main-exhortation">Main exhortation: Enter into that rest (4:11)</h2>
        <p>After reviewing those who fell short of the rest, understanding the nature of God's rest, and learning what entrance into his rest is like, the reader is now exhorted to enter that rest (4:11) and is given two reasons to enter it (4:12-13). The text reads, "Therefore, let us press on to enter into that rest so that no one will fall into the same pattern of disobedience," (σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας). This exhortation is grammatically subordinate to the opening of this section (4:1), Φοβηθῶμεν οὖν ("Therefore, we must be fearful"), however, the only command given in the first is to be fearful lest someone falls short (ὑστερηκέναι). The author now gives the full exhortation, in light of the doctrine of God's Sabbath-rest (4:3b-10). His main exhortation in 4:1-11 is to "press on to enter into that rest." "Press on," translating σπουδάσωμεν,<sup id="fnref51"><a href="#fn51">51</a></sup> a verb of motion that contains a sense of urgency.<sup id="fnref52"><a href="#fn52">52</a></sup> Working with εἰσελθὼν in v.10, σπουδάσωμεν shows that we must not only enter, but be diligent in our entry. A casual attitude toward entering God's rest will leave you outside the gates, falling short of his sabbath (4:1). The readers, along with the author, must zealously strive for the entrance to God's rest. They are to be like the person described in 4:10—the enterer (εἰσελθὼν)—who enters God's rest and rests from his works. The author shifts from a general axiomatic statement in 4:10 to a related, specific command in 4:11 (cf. vv. 5-6). The two subjunctive exhortations, Φοβηθῶμεν οὖν (4:1) and σπουδάσωμεν οὖν (4:11) are framed by the theology of the Sabbath-rest (4:3b-10). The church is to have an attitude comprised of healthy fear of falling short and eagerness to enter. They are to do so, because of the nature of God's rest.</p>
        <p>The author uses an anaphoric construction, ἐκείνην τὴν κατάπαυσιν ("enter into that rest") to describe the rest the believers are pressing forward to enter. The demonstrative ἐκείνην combines with the anaphoric use of the article τὴν to refer to the κατάπαυσιν spoken of earlier in the passage. The κατάπαυσιν was defined in v. 9 as a σαββατισμὸς (Sabbath-rest) and is God's place of rest which he entered into perpetually on the seventh day (4:4), resting from his works (4:10). It is that rest which the author urges himself and his readers to press on to enter.<sup id="fnref53"><a href="#fn53">53</a></sup> The believer who perseveres to the end will enter, not just the land of Canaan, not just the Israel of David's day, but the Edenic Sabbath-rest of God. The author urges the readers to enter it, for God has appointed a certain day, "Today" (4:7). Kleinig helpfully summarizes the theological force behind the author's exhortation: God provides the Sabbath-rest as the eschatological goal for his created cosmos, and it has been permanently available since then, so God's disqualification of the faithless from entry into the promised land prefigures the present exclusion of unbelievers and the entry of the faithful into his heavenly rest.<sup id="fnref54"><a href="#fn54">54</a></sup> The theological treatise on God's Sabbath-rest (4:3b-10) serves to emphasize the urgency for believers to enter that rest.</p>
        <p>God's rest has been available, but as Israel failed to enter (3:19; 4:6) and the conquest generation failed to look ahead to the true rest (4:8), the church is in danger of falling "into the same pattern of disobedience" (4:11). Here in the author's main exhortation, the readers face the same dangers as Moses' followers (3:7-19) but they are also offered the same opportunity on the basis of Ps. 95.<sup id="fnref55"><a href="#fn55">55</a></sup> The followers of Moses and Joshua had opportunity to enter the physical and spiritual land of rest. They fell short because of disobedience (4:6). Now the followers of the author of Hebrews have the same opportunity to enter the spiritual land of rest since God appoints today as the day of entry (4:7). Even though the wilderness and conquest generations failed to enter, the author of Hebrews can still urge his readers to press on because "there remains a Sabbath-rest for the people of God" (4:9). The theology of rest (4:3b-10) gives credence and legitimacy to the text's main exhortation (4:11). Westfall even goes so far to say that 4:1-13 answers a question raised about the legitimacy of commanding the readers to enter the rest that the Israelites in the wilderness generation failed to enter.<sup id="fnref56"><a href="#fn56">56</a></sup> The author uses a theology of the Sabbath to demonstrate the legitimacy and urgency of his call to enter. He can call the church to enter God's rest in good conscience, because it remains, and he can urge them to do so emphatically, because of the final phrase of v. 11.</p>
        <p>The church is urged to press on, "so that no one will fall into the same pattern of disobedience" (ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας). The pattern of ἀπειθείας, "disobedience," is the pattern of Israel's sin, when they did not enter διʼ ἀπείθειαν, "because of disobedience" (4:6). Those who do not enter God's rest will fall like Israel. The corpses of those who did not enter God's rest "fell (ἔπεσεν) in the wilderness" (3:17).<sup id="fnref57"><a href="#fn57">57</a></sup> Likewise, those who do not press on will fall (πέσῃ) into the same pattern of disobedience.<sup id="fnref58"><a href="#fn58">58</a></sup> The author makes an explicit connection between the disobedience of those who fail to enter in the church and Israel who failed to enter because of disobedience. He also makes an allusion to his earlier statement, that as the corpses of the disobedient ones fell (πιπτω) in the wilderness, so those who do not enter God's rest will fall (πιπτω) into their pattern of disobedience. As the corpses fell, so the dead unbelievers who do not heed the exhortation will fall into disobedience.<sup id="fnref59"><a href="#fn59">59</a></sup> Their corpses will then fall in like manner. Westcott analyzes that those who so fall become, in their punishment, an example like that offered by the Jews in the Wilderness, an example of the fatal consequences of disobedience fitted to alarm others.<sup id="fnref60"><a href="#fn60">60</a></sup> The church must press on to enter God's rest, or else they too will fall and become an example like that of the wilderness generation. Those who fall will be cut down by the sword of God's message.</p>

        <h2 id="reasons-to-enter">Reasons to enter that rest (4:12-13)</h2>
        <p>The author of Hebrews closes his section exhorting the church to enter God's rest by describing the judgment of his message should they fail to do so. These verses describe two reasons God's people should be fearful (4:1), press on, and not fall short (4:11). First, the message of God is a double-edged sword, and second, all are laid bare before God and his sword of judgment.</p>

        <h3>The message is a sword (4:12)</h3>
        <p>Believers must press on to enter God's rest "Because the message of God is living and energetic and sharper than any double-edged sword" (Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον). For the second time in this subsection, the author mentions God's λόγος. Previously the λόγος which was heard did not profit those who failed to enter God's rest (4:2). That same message becomes a double-edged sword to all who do not press on to enter his rest. This is not a dead message, but one that is living (Ζῶν) and energetic (ἐνεργὴς). The message of judgment that God brings on those who heard, but reject his message is living. It is not a dead message, but one that will judge those who do not enter God's rest.<sup id="fnref61"><a href="#fn61">61</a></sup> It is an energetic, or powerful, message of judgment.</p>
        <p>The two adjectives "living and energetic" show the efficaciousness of God's message. Returning to 4:2, the message that was heard was unprofitable. However, the reason that message was unprofitable was not because of a flaw in the message itself, but in the unbelieving and disobedient hearers. In the same way here in v. 12, the author defends God's message by calling it living and energetic. The previous hearers did not fail to enter his rest because of the message, for it is living and energetic, but because they refused to believe and obey it. The living and energetic message then becomes a message of judgment for them.</p>
        <p>The message of God does not cut gently. The author of Hebrews uses a graphic metaphor to describe the double-edged sword's judgment. God's message is "piercing until the division of soul and spirit, of both joints and marrow" (διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν). The sword does not cut, but pierces (διϊκνούμενος).<sup id="fnref62"><a href="#fn62">62</a></sup> In this imagery, the sword does not wound, it kills. The sword pierces until, or as far as (ἄχρι) the divisions between the soul and the spirit, and between joints and marrow. The sense is that it pierces up to the separation, in themselves, of soul and spirit, and of joints and marrow.<sup id="fnref63"><a href="#fn63">63</a></sup> While these phrases raise questions about the makeup of the soul and dichotomy versus trichotomy, these are not the issues the author of Hebrews has in mind. The author is continuing his image of a sword and describes the divisions (whether or not they exist) between soul and spirit and joints and marrow. The doublet, according to Smillie, rather than opposing the physical to the spiritual aspects of an individual, is more likely a literary device linking the two pairs together.<sup id="fnref64"><a href="#fn64">64</a></sup> Similarly, Bruce rightly cautions that it would be precarious to draw any conclusions from these words about our author's psychology, nor is it necessary to understand them in the sense of the Pauline distinction between soul and spirit.<sup id="fnref65"><a href="#fn65">65</a></sup> The author's purpose is not to delve into the nature of the inner man, but to show that God's message of judgment pierces to the depths of a person, such that it is able to "judge the thoughts and intentions of the heart" (4:12). The message is not merely external, condemning those who do not enter God's rest. It pierces to the heart, condemning those who are unbelieving (3:19) and disobedient (4:6). Those who do not enter God's rest are slain by the same message they refused to heed, like a certain Moabite king.</p>
        <p>Although not normally described as an allusion, or even cited at all, the description of a double-edged sword piercing the inner parts of the soul of an unbeliever is drawn from, and a direct reference to, the slaying of Eglon in Judges 3. The exact phrase μάχαιραν δίστομον only occurs here in the NT, but in three locations in the LXX: Judges 3:16; Psalm 149:6; and Proverbs 5:4.<sup id="fnref66"><a href="#fn66">66</a></sup> Bruce states that the expression "a two-edged sword" occurs a few times in the Old Testament, but there is no particular reference here to any one of its Old Testament occurrences.<sup id="fnref67"><a href="#fn67">67</a></sup> Unlike Ehud, Bruce misses the mark by glossing over Judges 3. Other writers like Smillie reference the text and even compare the weapon in the two passages. However, he stops short of calling it an allusion, or saying that the author of Hebrews is drawing on the story.<sup id="fnref68"><a href="#fn68">68</a></sup> This author contends that when the texts of Hebrews 4:12 and Judges 3:15-30 (LXX) are examined together, it becomes clear that Hebrews explicitly alludes to the account of Ehud. The text draws the imagery for the phrase μάχαιραν δίστομον (double-edged sword) from Ehud's sword, as he stabs the king of Moab.</p>
        <p>The other Old Testament quotations and allusions in the book of Hebrews are all taken from the LXX, and Hebrews 4:12 is no different. The LXX text of Judges 3:15-30 is a tight translation of the Hebrew text and may be examined to understand the narrative itself and the allusion to it in Hebrews 4:12.<sup id="fnref69"><a href="#fn69">69</a></sup> As noted above, Judges 3:16 is one of the three locations where the phrase μάχαιραν δίστομον is used in the LXX. The author of Judges writes that Ehud made for himself a double-edged sword, καὶ ἐποίησεν ἑαυτῷ Αωδ μάχαιραν δίστομον. Etymologically, the sword is "two-mouthed" (στομα δυο), a literal translation of the Hebrew. Ehud makes a μάχαιραν δίστομον for himself to execute God's judgment on Eglon, king of Moab. He conceals the double-edged sword as he brings Israel's tribute to the king. To make the king rise from his seat, Ehud says, "I have a message from God for you," Λόγος θεοῦ μοι πρὸς σέ (3:20). Ehud says nothing further after this, and when the king draws near, Ehud takes the sword (μάχαιραν) and thrusts it into Eglon's belly (3:21). The message of God (Λόγος θεοῦ) is the sword (μάχαιραν).<sup id="fnref70"><a href="#fn70">70</a></sup> Next, the author of Judges graphically details the reach of the sword, as Ehud thrusted it into Eglon's belly, and moreover even the hilt went in after the blade and the fat closed in upon the blade, for Ehud did not draw out the sword from his belly (3:21b-22). The text makes careful note of the depth of Ehud's stabbing. The double-edged sword goes into the inner being of Eglon. All three elements in Judges, the double-edged sword, the sword being God's message, and the depth of the stabbing, are appropriated by the author of Hebrews.</p>
        <p>In his description of God's message of judgment upon those who fail to enter his rest, the author of Hebrews lexically connects his warning to three components of the Ehud narrative. Hebrews says that the message of God (ὁ λόγος τοῦ θεοῦ) is sharper than any double-edged sword (μάχαιραν δίστομον). Ehud had a sharp double-edged sword to pierce the fat belly of Eglon, but the message of God is even sharper. The comparison between the double-edged sword and God's message does not originate with the author of Hebrews. Within the Ehud narrative, the author of Judges makes it clear that the message from God is the sword the king is stabbed with (Judg 3:20-21). The message that is sharper than a double-edged sword pierces to the division of soul and spirit, joints and marrow. This is reflective of the description of the deep stabbing in 3:21b-22.<sup id="fnref71"><a href="#fn71">71</a></sup> The key components of the description of God's message in Hebrews 4:12 all come from Judges 3. The author takes the narrative, which already shows that the message from God is a double-edged sword, and alludes to it to indicate the seriousness of God's judgment. Those who fail to enter God's rest, who do not press on, who fall into the same pattern of disobedience (Heb 4:11) will be judged by the message of God, just like Eglon (4:12). This often-overlooked OT allusion serves to reinforce and intensify the message of Hebrews 4:1-13.</p>

        <h3>The message is for us (4:13)</h3>
        <p>The church must decide how to respond to the exhortation to enter God's Sabbath-rest. The author of Hebrews concludes his exhortation with a personal and practical note in v. 13. Lest the readers think that God's double-edged sword will not pierce them, the author warns that God sees all people, that they too are liable to judgment should they fall short of his rest, and that they must decide how to respond to his message. The reason this message of judgment can pierce anyone is "there is no invisible creature before him" (οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ). The antecedent of αὐτοῦ must be θεοῦ (4:12), so the author of Hebrews is declaring that no one, man or beast, or anything in creation can escape God's sight. "Invisible" translates ἀφανὴς, which only occurs here as a noun, and is simply the root φαινω with the alpha privative. The reason no one is invisible before God is indicated by the phrase following δὲ, "all are naked and laid bare before his eyes" (πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ). Mankind, although clothed, is in a sense the same before God as Adam and Eve were in the garden—naked and exposed before him. Adam and Eve could not cover their sins with garments of fig leaves or hide in the bushes, and neither can any of their descendants. All creatures are not only naked (γυμνὰ), but they are also laid bare (τετραχηλισμένα).<sup id="fnref72"><a href="#fn72">72</a></sup> A hapax, occurring only here in the NT or LXX, τετραχηλισμένα has a debated meaning. It likely stems from the noun τραχηλος, which means neck throughout the NT. If so, the author of Hebrews would be referring to creatures being grabbed by the neck, i.e. brought directly before God's eyes. The verb is a perfect participle, indicating that all creatures are in the state of being before God's eyes, hence the idiomatic translation, "laid bare" captures the sense of τετραχηλισμένα. Not only are creatures not invisible, their necks have been dragged as it were, directly into God's line of vision.</p>
        <p>God himself will judge those who do not enter his rest. The message of faith, if rendered unprofitable through disobedience and unbelief (4:2) will cut the unrepentant like a double-edged sword. Since no one can escape God's sight, all who do not enter his rest will be judged. Here in v. 13, the author shows that exposure to the word of scripture entails exposure to God himself.<sup id="fnref73"><a href="#fn73">73</a></sup> Those who hear God's message have been brought before God himself. He will be certain to judge all who do not respond with fear (4:1) and press forward to enter his rest (4:11). Therefore, the author concludes this Sabbath-rest warning with a final word of exhortation, "for whom the message is to us" (πρὸς ὃν ἡμῖν ὁ λόγος). This phrase is ambiguous and has led to much debate over its meaning. The subject ὁ λόγος, has been mentioned in 4:2 ("the message which was heard") and 4:12. In both cases, it refers to God's message: that those who do not believe will never enter his rest and that the church must fearfully press on to enter it. This message will be a piercing sword to all who do not heed it. It makes the most sense then, for this third use of ὁ λόγος to also refer to God's message. As Smillie writes, it is uncharacteristic of a writer that he would, after carefully delineating the many and various qualities of ὁ λόγος in v. 12, bring the pericope to a close using ὁ λόγος as the very last word in figurative expression with a meaning having little to do with the principal theme of the discourse.<sup id="fnref74"><a href="#fn74">74</a></sup> There is no reason to assume that ὁ λόγος has any different meaning in 4:13, than in the rest of the text.</p>
        <p>Some translations and authors see a rare meaning of ὁ λόγος in v. 13 and render it "to whom [God] we must give an account." However, as Smillie and others point out, three conditions are always present when λόγος means "account." It must be paired with a form of διδωμι or δοσις (to give, a gift), it is ordinarily anarthrous, and it must be in the accusative case.<sup id="fnref75"><a href="#fn75">75</a></sup> None of these three conditions are met in Hebrews 4:13, as ὁ λόγος is not paired with any verb, it is definite, and it is in the nominative case. The author of Hebrews actually uses λογος to refer to an account in 13:17, where he writes "as those who must give an account" (ὡς λόγον ἀποδώσοντες), and collocates λογος with a form of διδωμι and uses it in the accusative. The meaning of λογος as account, instead of a message, is readily apparent in Hebrews 13:17 from the structure of the phrase itself and the context. This is not the case in 4:13. The author of Hebrews uses ὁ λόγος three times in 4:1-13, and he refers to God's message each time.</p>
        <p>The best way to understand the final phrase of Hebrews 4:1-13 is in reference to the obligation of the message's hearers. All creatures are naked and laid bare before God, and his message is for them. The double-edged sword has been set before God's creation, and they must decide what to do with it. The choice to respond in faith or unbelief was given to the wilderness generation, and they chose to stay outside the promised land. The conquest generation under Joshua was given the opportunity and obligation to look for the true rest, beyond the physical land of Canaan. They too failed to enter God's eternal, Sabbath-rest. Yet all hope is not lost, for God has set today, as the day for entry into his rest. The message is clear: be fearful and press on to enter his rest (4:1, 11). This message is a piercing, double-edged sword, and lies before all who hear it, as they lie naked and exposed before God. Those who do not heed the message will find themselves pierced through, like Eglon the king of Moab. Those who heed the warning of Hebrews 4:1-13 and press on, entering God's rest, will find rest from their works. They will enter God's blessed, eternal Sabbath-rest. Aquinas writes, "If God created man for eternal beatitude, since to His own image and likeness He created him, therefore He prepared a rest for him… And therefore it remains that some are to enter in."<sup id="fnref76"><a href="#fn76">76</a></sup> The Sabbath-rest remains for the people of God. His people are to press on, persevering through the grace of Christ's high-priestly ministry. The road of the Christian life leads to an eternal seventh day. Those who enter God's Sabbath-rest will dwell with him, freed from works, enjoying eternal, blessed rest in the new Eden.</p>

        <h2 id="introduction">Introduction</h2>
        <p>Jesus was largely rejected by His own people. John makes this shocking statement about Jesus in his gospel prologue: "He came to His own, and those who were His own did not receive Him" (John 1:11). The overall denial of Christ by the Jews has caused many to wrestle with the reason for this rejection. It is thus important to understand what the Jews believed about salvation at the time of Christ. Traditionally, the Jewish leaders, followed by their people, have been viewed as legalists, although recent scholars have challenged this perspective. This paper will prove from the Gospel accounts that the Jews at the time of Christ were largely legalistic and relied on the works of the law and their Abrahamic descent to receive eternal life and be counted righteous before God. It will also explore key exceptions to this characterization and highlight the expectation of and faith in a Messiah that is commended by Jesus and the Gospel writers. The Gospels present the majority of Jews at the time of Christ as legalistic, believing their obedience and lineage granted them some form of salvation.</p>
        <p>The characterization of second-temple Judaism as legalistic has been questioned in recent decades by the loosely defined "New Perspective on Paul" (NPP) movement.<sup id="fnref1"><a href="#fn1">1</a></sup> While this paper is not an evaluation of the NPP or Paul's writings, the presuppositions and beliefs of the NPP are challenged by what the Gospels reveal about Jewish beliefs on salvation. The NPP advocates that the Jews were actually not legalistic but rather held to covenantal nomism.<sup id="fnref2"><a href="#fn2">2</a></sup> Thus, the Jewish people largely believed they entered God's gracious covenant through Abrahamic lineage and remained in the covenant by obedience. N. T. Wright summarizes that the Jew keeps the law out of gratitude, as the proper response to grace — not to get into the covenant people, but to stay in.<sup id="fnref3"><a href="#fn3">3</a></sup> According to Wright and others, what Paul and the NT authors are rebuking among the Jews is their exclusion of others from God's grace on the grounds of Abrahamic descent. Thus, the problem among the Jews at the time of Christ was not legalism, but an ethnocentrist or ethnoexclusivist attitude.<sup id="fnref4"><a href="#fn4">4</a></sup> While the NPP may do well in emphasizing the ethnocentrism of the Jewish people, it falls short in its dismissal of legalism.<sup id="fnref5"><a href="#fn5">5</a></sup> A study of the Gospels themselves clearly demonstrates the legalism and ethnocentrism of second-temple Judaism. The Jews were in fact legalists and their rampant legalism, combined with ethnocentrism, directly led to their rejection of the Messiah. The legalistic tendencies and prevailing views of salvation among the Jews become evident in their responses to John the Baptist and in five key passages: Matthew 12:1–13; John 5; John 8–9; Luke 18:9–14; and Matthew 23.</p>

        <h2 id="responses-to-john-the-baptist">Responses to John the Baptist</h2>
        <p>The Gospels first demonstrate Jewish perspectives on salvation through the responses to John the Baptist. The positive response of some of the Jewish people and negative response by the religious leaders sets the stage for Christ's interactions with them. Each Gospel emphasizes the ministry of John the Baptist, which is to prepare the way of the Lord, as stated in Isaiah 40:3. John prepares the way of the Lord by his preaching and baptism, which converge as he reveals who the Christ is. John's message to the Jewish people is clear: "Repent, for the kingdom of heaven is at hand" (Matt 3:2). His ministry is summarized by Mark and Luke as "preaching a baptism of repentance for the forgiveness of sins" (Mark 1:4; Luke 3:3). Many Jews respond to John's message as his ministry was marked by the residents of Judea and the Jordan region "being baptized by him in the Jordan river, while confessing their sins" (Matt 3:6). These Jewish people responded to John's call to repent by acknowledging their sinfulness. Matthew distinguishes these repentant crowds from the next group: "many of the Pharisees and Sadducees coming to his baptism" (3:7). Matthew presents John's interaction with these leaders to highlight their rejection of salvation and foreshadow Christ's later condemnation of them.</p>
        <p>The Pharisees and Sadducees are introduced here for the first time in Matthew's gospel and characterized by John as a "brood of vipers" (Matt 3:7).<sup id="fnref6"><a href="#fn6">6</a></sup> They do not come to be baptized by John and do not demonstrate the repentant posture found in the recipients of his baptism.<sup id="fnref7"><a href="#fn7">7</a></sup> While the crowds confess their sins and are baptized for repentance, John questions why the Pharisees and Sadducees come, asking "You brood of vipers, who warned you to flee from the wrath to come?" (3:7). John's sarcastic question demonstrates they do not in fact come to him to be baptized and escape from the coming wrath. The religious leaders believe they can say to themselves, "We have Abraham for our father" (3:9). John warns there is no escape from the judgment through this ethnocentrism, and that if they do not "bear fruit in keeping with repentance" they will be cut down and thrown into the fire (3:8, 10). He says the one coming after him will baptize with fire by threshing the wheat and burning up the chaff (3:11-12). John's message, "Repent for the kingdom of heaven is at hand" (3:2), prepares the way for the Lord by urging the Jews to repent before the coming judgment. The baptism of repentance offered by John will give way to the Messiah who baptizes with the Spirit and with fire. Matthew records no response by the Pharisees and Sadducees in this narrative, only the words John voices on their behalf, "We have Abraham as our father" (3:9). The leaders are presented with the options: bear the fruit of repentance or cling to their Abrahamic lineage and continue in their current deeds.</p>
        <p>John's preparation of the Lord's way climaxes in Christ's baptism. Priests and Levites from Jerusalem asked John whether he was the Messiah, Elijah, or the prophet to come (John 1:19-21). When John saw Jesus coming to be baptized, he proclaimed, "Behold, the Lamb of God who takes away the sin of the world" (1:29). John pointed those who confessed their sin while being baptized, to the Lamb who could take away their sin. He baptized Jesus and saw the Spirit descend as a dove, demonstrating that Jesus is the one who baptizes with the Spirit, and is truly the Son of God (1:30-34). Yet the religious leaders do not follow Jesus as the Messiah. Instead, it is those who will become His disciples that follow John's direction to behold the Lamb. First, Andrew exclaims, "We have found the Messiah" (1:41), demonstrating the Jewish Messianic expectation. Philip expands this confession, "We have found Him of whom Moses in the Law and the prophets wrote: Jesus of Nazareth, the son of Joseph" (1:45). The disciples immediately heed the direction of John and their companions to follow Jesus because they have been waiting for the Messiah.</p>
        <p>The responses to John the Baptist are foundational for understanding Christ's interactions with the Jews. Many confessed their sins and others, like the disciples, even followed Jesus after John pointed the way. The Pharisees and Sadducees were rebuked by John as a brood of vipers who need to repent. After John reveals that Jesus is the Christ, they continue in their sins instead of submitting to Him. The religious teachers should have urged their people, like John did, to follow Christ. Instead, out of the hardness of their hearts, they continued in their empty religious works and did not bear the fruit of repentance. As Jesus demonstrates that He is the Messiah by teaching and healing, He rebukes the religious leaders for their legalistic hypocrisy.</p>

        <h2 id="matthew-12113">Matthew 12:1–13</h2>
        <p>In Matthew 12:1-13, the disciples eat heads of grain and Jesus heals a man's hand on the Sabbath day. The Pharisees rebuke Jesus for the action of His disciples and test Him by asking whether it is lawful to heal on the Sabbath. These related Sabbath pericopes demonstrate the Pharisees' legalism. Christ's corresponding rebukes shows how His followers should prudently apply the law.</p>
        <p>The disciples violate Jewish interpretation of the Sabbath law in Matthew 12:1-8. They picked and ate grain out of hunger (v. 1), and the Pharisees point out that these actions are unlawful (ἔξεστιν) on the Sabbath (v. 2; cf. v. 10). The Old Testament added a few stipulations to the original Sabbath command, but the rabbis fleshed out this command even further, including thirty-nine different categories of prohibited work.<sup id="fnref8"><a href="#fn8">8</a></sup> Jesus cites two narratives in Scripture: David and his men, and the temple priests (vv. 3-5). David and his men ate on the Sabbath from hunger, and the priests work on the Sabbath because of the importance of temple worship. David and his hungry warriors show that human needs should not be neglected on the Sabbath. The reference to priests working on the Sabbath in verse 5 implies that Christ's disciples, by following Jesus, are serving God like the priests do. In fact, Jesus and His kingdom are even greater than the temple (v. 6). The scene concludes with Jesus rebuking the Pharisees for their lack of compassion and declaring Himself Lord of the Sabbath (vv. 7-8). This legalistic lack of compassion is shown again in the following Sabbath narrative.</p>
        <p>Jesus and his disciples next encounter the Pharisees in their synagogue. Seeing a man with a paralyzed hand, the Pharisees see the opportunity to accuse Jesus, as Matthew editorially notes (Matt 12:10). They do not question Christ's ability to heal but ask if it is lawful (ἔξεστιν; cf. v. 2) to heal on the Sabbath. Jewish literature shows the Pharisees thought it was unlawful to heal on the Sabbath unless it was a life-or-death matter.<sup id="fnref9"><a href="#fn9">9</a></sup> The Pharisees are entirely focused on the law and this apparent opportunity to bring legal charges against Jesus. In response, Jesus does not argue over the Mosaic law, Rabbinic traditions, or the definition of work. He simply asks the rhetorical question: if any of you had a sheep fall into a pit on the Sabbath, would he not lift it out? (12:11-12). Lifting a sheep out of a pit is work, a good deed, which even the Pharisees would not balk at. Yet, as Jesus declares, "How much more valuable is a man than a sheep?" (v. 12). Jesus then heals the man, and the Pharisees depart to plot a way to destroy Jesus (vv. 12-14). The conclusion of these two Sabbath events is stated by Jesus, "So then it is lawful to do good on the Sabbath" (v. 12).</p>
        <p>The Pharisees in Matthew 12 condemn the disciples for satiating their hunger and seek to accuse Jesus of healing a man on the Sabbath. By so doing, they display a complete lack of compassion (Matt 12:6) and focus on external observance of the law instead of the love the law requires. Christ's rebuke of the Pharisees from Hosea 6:6, "I desire compassion and not a sacrifice" (Matt 12:7) shows the danger of legalism. The Pharisees were so focused on the letter of the law that they neglected the compassion required by it. As Charles Quarles comments on the quotation of Hosea, though the Pharisees sought the mercy of God through acts of sacrifice, they failed to show mercy to other sinners.<sup id="fnref10"><a href="#fn10">10</a></sup> They were like a slave who had been forgiven a great debt but refused to forgive his own debtors (Matt 18:21-35). In their legalism, they miss the point of the Sabbath and show no love towards the disciples, or to the man in their synagogue—using him as a legal pawn. Instead of legalism, Jesus teaches that the Sabbath is to be kept holy, but this does not exclude doing good, especially showing mercy to those in need.<sup id="fnref11"><a href="#fn11">11</a></sup> The legalism of the Pharisees causes them to miss showing mercy as required by the law. It blinds them to real need and causes them to reject Jesus, the one who keeps the law by doing good on the Sabbath. In Matthew 12:1-13, the Pharisees reject their Messiah in favor of their legal system. Their legalism manifests itself again in John 5, where their perspective on salvation is made even clearer.</p>

        <h2 id="john-5">John 5</h2>
        <p>John chapter five opens with Jesus healing a man who was a paralytic for thirty-eight years, once again, on the Sabbath (John 5:1-9). The Jews scold him for carrying his mat on the Sabbath, to which he replies that the man who healed him gave him this command (5:10-13). John notes that after this event, "the Jews began persecuting Jesus because he was doing these things on the Sabbath" (5:16). Jesus responds to this persecution, not by asserting again that He showed mercy, as in Matthew 12:9-13, but with, "My Father is working until now and I Myself am working" (5:17). Jesus says He can heal on the Sabbath because His Father is working on the Sabbath. The Jews recognize that Jesus is making Himself equal with God and respond by renewing their persecution (5:17-18). As Kang writes of the Jews, in their blind zeal for their Law, they failed to see the divine power of Jesus.<sup id="fnref12"><a href="#fn12">12</a></sup> They reject Jesus because of their legalistic approach to the Sabbath law and thus reject His claim to be equal with God (cf. 9:24). Jesus responds by asserting that John the Baptist, His works, and His Father all testify about Him (5:33-47). The Jews, who claim to have God as their father, have not heard His testimony (5:37). In fact, although they claim to love the law, Jesus says to them, "you do not have His word abiding in you, because you do not believe the one whom He sent" (5:38). The Jews "search the Scriptures" thinking in them they have "eternal life," but miss the One the Scriptures testify about and are unwilling to come to Him for eternal life (5:39-40).</p>
        <p>The Jews were blinded to the coming of Jesus for their salvation by their legalism. They searched the Scriptures diligently, thinking to find eternal life in them. D. A. Carson characterizes the searching Jews as hoping for "final acceptance by God" in the form of eternal life.<sup id="fnref13"><a href="#fn13">13</a></sup> This is seen most clearly in the Mishnah: "The more Torah, the more life… he who has acquired for himself words of Torah has acquired for himself life in the world to come."<sup id="fnref14"><a href="#fn14">14</a></sup> The words of Christ and the very words of the Jews themselves in the Mishnah demonstrate their belief about salvation. As Colin Kruse puts it, through the diligent study of the Scriptures the Jewish leaders believed they would find eternal life.<sup id="fnref15"><a href="#fn15">15</a></sup> Yet these Jews who diligently searched the Scriptures do not have God's word abiding in them because they do not believe in Christ (John 5:38). They reject Christ who came in the name of His Father (5:43). By disbelieving Jesus, they disbelieve Moses who wrote the words they claim to uphold, as Jesus says, "If you believed Moses, you would believe Me, for he wrote about Me" (5:46). Thus, He says, "the one who accuses you is Moses, in whom you have set your hope" (5:45). The Jews sought to accuse (κατηγορήσωσιν) Christ in Matthew's Sabbath-day account (Matt 12:10) but are being accused (κατηγορῶν) by Moses for their rejection of Christ (John 5:45). The Jews condemn themselves by disbelieving the words they study, and the one whom the words spoke of.</p>
        <p>The Jews sought life in the study of Scripture and tradition. They rejected the one whom the Scriptures testified about and looked forward to. Their search for life led them to legalism, believing that their external obedience had them on the path to life and that they had no need to repent. They rejected Christ, the one who has life in Himself; those who were Christ's own people did not receive Him (John 1:4, 11). Their legalism led to their rejection of Christ. However, as noted in the introduction and seen in the responses to John the Baptist, the Jews also rejected Christ and remained in their sin because of their ethnocentrism. They believed they had no need of salvation, of freedom from slavery, because they were descended from Abraham. This theme is continued in John 8-9.</p>

        <h2 id="john-89">John 8–9</h2>
        <p>In John 8:12-9:41, Jesus teaches that He is the light of the world and immediately proves His teaching by healing a man born blind. This is set in the larger context of the feast of booths (John 7:2) during which Jesus demonstrates that He is the Lord who brought Israel out of Egypt (8:24, 28, 58), the rock of living water (7:37-39), and guiding light (8:12; 9:5). He is thus the fulfillment of the Feast of Tabernacles, namely, the one who led Israel out of slavery in the exodus and will lead His people in a new exodus.<sup id="fnref16"><a href="#fn16">16</a></sup> His foundational statement, "I am the Light of the world, he who follows Me will never walk in the darkness but will have the Light of life," is immediately rejected by the Pharisees (8:12-13). Jesus again emphasizes, as He did in chapter five, that His Father testifies about Him, and these Pharisees do not actually know the Father (8:18-19). He calls the crowds to believe in Him lest they die in their sins, and many do appear to believe in Him (8:24-30). However, this is not a belief like that manifested by the recipients of John's baptism or the disciples in Matthew 3 and John 1.</p>
        <p>Christ calls the supposedly believing Jews to abide in His word in order to be true disciples and to be set free by the truth. The Jews respond, "We are Abraham's seed and have never been enslaved to anyone. How is it that You say, 'You will become free'?" (8:33). Christ tells them that sinners are slaves of sin, they can be made free by the Son, and that if they were truly Abraham's seed, they would not seek to kill Him (8:34-37). They see no need to be baptized and set free but believe they are free because of their Abrahamic descent. But as John warned the Pharisees and Sadducees, they cannot say to themselves "We have Abraham for our father" (Matt 3:9). When the Jews reaffirm their Abrahamic sonship, Jesus responds, "If you are Abraham's children, you would do the deeds of Abraham" (8:39). The deeds of Abraham are related by Jesus in verse 56, "Your father Abraham rejoiced to see My day, and he saw and was glad." While the Jews tried to claim Abraham as their defense, Edward Klink notes it was Jesus to whom Abraham had long been witnessing.<sup id="fnref17"><a href="#fn17">17</a></sup> The Jews, by their rejection of Christ, show that they are not Abraham's children. Christ declares "Before Abraham was, I am," claiming the name of Yahweh from Exodus 3, but the Jews respond by picking up stones to throw at Him (8:58-59). The children of Abraham reject the Messiah Abraham looked forward to.</p>
        <p>The Jews are blinded to their sin by their Abrahamic descent, believing they do not need to be freed from sin but instead treated as Abraham's and God's children. John prepared the way for the Messiah by preaching a baptism of repentance, which many Jews did receive while confessing their sins (Matt 3:6-7). However, others, like the Pharisees and Sadducees in Matthew 3 and the crowd of Jews in John 8 shut their eyes to the light of the Messiah. Jesus shows in John 8-9 that He is the light of the world, the Servant to whom the Father spoke: "I will appoint You as a covenant to the people, As a light to the nations, to open blind eyes, to bring out prisoners from the dungeon and those who dwell in darkness from the prison" (Isa 42:6-7). These Jews in John 8 believed they were already seeing and set free from prison, when in reality they were enslaved to sin. Thus, they rejected the Messiah who declared Himself to be the light of the world, the light to the nation. However, the narrative shifts as Jesus flees the temple, and a truly blind man receives physical and spiritual sight. In John 9, Jesus proves Himself to be the Servant of whom Isaiah spoke.</p>
        <p>Jesus and His disciples encounter a man blind from birth as they leave the temple. Jesus reiterates that He is the light of the world (John 9:5) and proves it by healing the man born blind (9:6-7). By giving physical sight to a blind man, Jesus shows He can also open the eyes of the spiritually blind. The now-seeing man testifies that it was Jesus who healed him (9:11), so he is interrogated by the Pharisees (9:13-34). Some of the Pharisees dismiss Jesus as one who is not from God, since He healed the man on the Sabbath (9:14, 16). Because others disagreed, they questioned the man and his parents further to verify the miracle. As on previous Sabbath healings, the Pharisees show no care for the person healed.<sup id="fnref18"><a href="#fn18">18</a></sup> The man is not afraid when the Pharisees interrogate him and dismiss Jesus but simply astounded that he can now see (9:24-34). The Pharisees then claim to be disciples of Moses, not Jesus (9:28-29), having not learned their lesson that Moses testified of Jesus (5:39-40). The formerly blind man does not care that the Pharisees view Jesus as a sinner, because he can see, and no one has ever healed a man blind from birth (9:25, 30-32). He recognizes, "If this man were not from God, He could do nothing" (9:33), so the Pharisees throw him out of the synagogue (9:34).</p>
        <p>Jesus finds the man again and asks if he believes in the Son of Man (9:35). He is eager and willing to believe, asking, "Who is He, Lord, that I may believe in Him?" (9:36). This man, like the faithful disciples of John and Jesus, displays a clear expectation of the Messiah. He is looking (both spiritually and now physically) for the Son of Man. He does not rely on his Abrahamic lineage or a supposed lack of sin, like the Pharisees. He does not rest in being a disciple of Moses. He looks for the coming of the Son of Man, prophesied in Daniel 7:13-14. Jesus then reveals His identity, and the man responds, "Lord I believe" and worships Jesus (9:38). Christ has brought spiritual light and physical light to this man, showing that He is the true light coming into the world (1:9). The man has had his physical blindness and spiritual blindness removed by the one who came "so that those who do not see may see and that those who see may become blind" (9:39). The Pharisees ask, "we are not blind too, are we?" expecting that Christ will say no. Instead, Jesus confronts their sin once again, "If you were blind you would have no sin, but since you say, 'We see,' your sin remains" (9:41). As Klink comments, just like the blind man, before someone can claim "I believe," they must first declare, "I am a sinner."<sup id="fnref19"><a href="#fn19">19</a></sup> In John 8-9, the Jews believe they are not slaves to sin, but instead children of Abraham and disciples of Moses. They refuse to believe the Son of Man when He reveals Himself. Their sin is not forgiven; instead, it abides precisely because they are so confident of their righteousness.<sup id="fnref20"><a href="#fn20">20</a></sup> However, as the healed man, along with the faithful recipients of John's baptism and the disciples show, some are waiting for the Messiah and are ready to confess and repent from their sins. They understand the need for salvation from sin and that only the Messiah can bring resurrection life. These contrasting perspectives on salvation are also clearly seen in the parable of the Pharisee and the tax collector.</p>

        <h2 id="luke-18914">Luke 18:9–14</h2>
        <p>In the parable of the Pharisee and tax collector, Jesus teaches on the legalism that marked many in the Jewish community at the time of Christ, particularly the religious leaders. In this same parable He also shows the free confession of sin and calling out to God for salvation that marks His true disciples. The parable summarizes the view of salvation by those who rejected Christ and the repentant hearts of those who believed in Him.</p>
        <p>Christ addresses this parable "to some people who trusted in themselves that they were righteous and disdained others" (Luke 18:9). Self-righteousness is no better exemplified than by the Pharisee in the parable who prays, "God, I thank You that I am not like other people: swindlers, unrighteous, adulterers, or even like this tax collector. I fast twice a week; I pay tithes of all that I get" (18:11-12). The characteristic legalism already seen in the gospels is demonstrated here, where it also manifests in pride. This Pharisee was prideful because he fasted twice a week and paid tithes from everything (cf. Matt 23.23). He not only kept God's requirements, but, as Robert Stein notes, he believed he had done more than God required.<sup id="fnref21"><a href="#fn21">21</a></sup> The Pharisee believed he earned his righteousness before God by his superb keeping of the law, unlike the tax collector. This sort of pride leads to disdaining others (18:9). John Piper helpfully notes that the exclusivistic treatment of others is one manifestation of the self-righteousness that trusts in its own law-keeping — legalism and ethnocentrism have the same root and are not separate conditions of the soul.<sup id="fnref22"><a href="#fn22">22</a></sup> The legalist in this prayer views himself as superior to others due to his law-keeping. Legalism, pride, and ethnocentrism are all correlated. The legalist's prayer is then contrasted with the prayer of the tax collector.</p>
        <p>The tax collector stood apart from the Pharisee and had no regard for his fellow prayer-warriors in the temple. His humility is demonstrated as he "was not willing to lift up his eyes to heaven but was beating his chest" (Luke 18:13). Jesus says the humble will be rewarded with exaltation (18:14). What could be more humble than the publican's prayer, "God, be merciful to me, the sinner" (18:13)? There is no mention of his law-keeping; in fact, he acknowledges that he is a sinner and has broken the law. He does not look to his fasting or tithe-paying for hope. He knows he is spiritually blind, lame, and paralyzed. Like the blind man in John 9, he simply exercises faith in God. For this reason, Jesus says, "this man went down to his house justified rather than the other" (18:14).</p>
        <p>Many Jews in the day of Christ, including those He first spoke this parable to (18:9), embodied legalism by trusting in their obedience to the law for righteousness. The perspective of the Pharisee on salvation in this parable is the same one held by the Jews in John 8-9. Simply put, their perspective on salvation was that they did not need salvation. The fault of the Pharisee in Luke 18 was not his actions, but how he viewed them. F. F. Bruce writes that his fault lay, not in the performance of these duties, but in his confidence that by their performance he had satisfied God's requirements and might approach Him without any misgivings.<sup id="fnref23"><a href="#fn23">23</a></sup> Jesus summarizes the religious leaders and the Jews at large in this text, demonstrating that their problem was assuming law-keeping could satisfy God's requirements. Joel Beeke cites this text in his analysis of the New Perspective on Paul as evidence that self-righteousness and merit theology were indeed an issue among the Jews.<sup id="fnref24"><a href="#fn24">24</a></sup> The Pharisee thanks God in his prayer and keeps God's law, at least externally, but he does so in a spirit of boasting. The law-keeping of the Jewish people was not done out of gratitude to God for saving them, but out of a legalistic and boastful spirit. As Bruce further notes, this Pharisee expected the divine approval because he believed he deserved it — the tax collector knew what he deserved, and for that very reason cast himself upon the grace of God.<sup id="fnref25"><a href="#fn25">25</a></sup> The tax collector is aware of his sin, not claiming to see like the Pharisee praying across from him. He knows that he is blind and simply cries out to God for mercy. The tax collector is a remnant among the Jewish community of Christ's day. He freely confesses his sin before God in stark contrast to the rampant legalism of the religious leaders and the community as a whole. He is counted by Christ as justified before God, but the Pharisee is condemned. Christ's condemnation of the legalistic leaders is most clearly seen in Matthew 23.</p>

        <h2 id="matthew-23">Matthew 23</h2>
        <p>Matthew 23 serves as the counterpart to Matthew 5:3-12, insofar as the latter proclaims blessing on the followers of Christ, and the former woe and judgment on those who reject Him. Jesus addresses both believers and unbelievers in this discourse, as the audience consists of the crowds (representative of the unbelieving world in Matthew's gospel) and His disciples (23:1). Thus, while the discourse is primarily about the scribes and Pharisees (23:2), they are not the only hearers. The hypocrisy and legalism Christ condemns pertains to both the religious leaders and their followers—the larger Jewish community. Yong-Eui Yang writes that the only reason the Pharisees and other leaders are so severely criticized by Jesus in Matthew is that they, as religious guides, not only failed to respond to the teaching and work of Christ and his kingdom, but also misguided other Jews and became a hindrance to them.<sup id="fnref26"><a href="#fn26">26</a></sup> The specific condemnation of the religious leaders must not cause the reader to overlook the warning and application to the entire religious community, as they readily followed their leaders, a fact seen clearly in the crucifixion account. Jesus warns against the legalism and hypocrisy displayed in the entire Jewish community, which would lead them to crucify Him later that week.</p>
        <p>The opening verses describe the actions of the scribes and Pharisees (Matt 23:2-12), which is followed by seven declarations of "woe" (23:13-35), followed by a short statement of the coming destruction of the temple (23:36-39). Jesus says the scribes and Pharisees have "seated themselves in the chair of Moses," as they teach the Law of Moses to the people (23:2). Their teaching should be followed by the people, as Jesus says, "all that they tell you, do and keep" (23:3). What should not be imitated is their conduct, "for they speak and do not do" (23:3). Their actions are not in accord with God's law, in part, because of their motives: "They do all their deeds to be noticed by men" (23:5). Piper writes that their pursuit of Torah was not out of gratitude to God, but out of craving for human glory, which is why they could not believe on Jesus.<sup id="fnref27"><a href="#fn27">27</a></sup> Jesus thus repeats the condemnation Luke recorded in the parable of the Pharisee and the tax collector: "whoever exalts himself shall be humble, and whoever humbles himself shall be exalted" (23:12). The legalism manifested by the Jewish leaders led to pride and the judgment announced in the successive verses.</p>
        <p>The first two woes (Matt 23:13, 15) condemn the scribes and Pharisees for leading astray both their local Jewish communities and proselytes. They "shut off the kingdom of heaven from people; for you do not enter in yourselves nor do you allow those who are entering to go in" (23:13). The religious leaders throughout the gospels refuse to confess their sin, instead preaching obedience to a law that they themselves neglect (23:23). They refused to confess their sins and confess Jesus as the Messiah and sought to prevent others from doing so (cf. John 9:22-34). The third woe, concerning oaths, demonstrates how the leaders manipulated the law to avoid its penalty through external obedience (23:17-22). The fourth and central woe is the clearest description of legalism in the oracle: "Woe to you, scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin and have neglected the weightier provisions of the Law: justice and mercy and faithfulness; but these are the things you should have done without neglecting the others. You blind guides, who strain out a gnat but swallow a camel" (23:23-24).</p>
        <p>The religious leaders obeyed the law externally, but not internally. As C. J. Williams writes, they got the details right in some respects, but details were all they had.<sup id="fnref28"><a href="#fn28">28</a></sup> As shown in their condemnation of the disciples and heartless treatment of the disabled (Matt 12:1-13), the leaders lacked the justice, mercy, and faithfulness required by the law. Jesus summarized the proper attitude toward neighbor in the Sermon on the Mount, "in all things, whatever you want people to do for you, so do for them, for this is the law and the prophets" (Matt 7:12). The Jewish people, following their leaders, strained out gnats such as washing hands or refraining from journeys, but gulped down camels of pride, injustice, and overall unmerciful behavior. Their legalism led to blatant hypocrisy.</p>
        <p>Woes five and six condemn the lack of repentance manifested by the religious leaders. Their external obedience is like failing to wash the inside of a cup or like painting the outside of a tomb (Matt 23:25-28). The ones who claim to love the law are in fact, "full of hypocrisy and lawlessness" (23:28). The seventh woe condemns them for building tombs for their prophets and saying, "If we had been living in the days of our fathers, we would not have been partners with them in shedding the blood of the prophets" (Matt 23:30). Rather than being sons of Abraham, as the Jews in John 8 claimed, they are by descent and action, "sons of those who murdered the prophets" (23:31). Had they truly listened to Moses and the prophets, they would recognize that Jesus is the Messiah, but blinded by their sin, they will fill up the measure of their fathers by crucifying him (23:32). Jesus then pronounces the same judgment that John the Baptist spoke, "You serpents, you brood of vipers, how will you escape the sentence of hell?" (23:33; cf. 3:7). They will not escape the one who baptizes by fire. By condemning Jesus to death, they condemn themselves and will slither like snakes to escape the fire they lit. This fiery judgment is described by Jesus in two stages in Matthew 23:36-25:46. The coming destruction of Jerusalem in A.D. 70 serves as a sign and seal of the final eschatological judgment. The legalism and hypocrisy of the religious leaders will bring about God's judgment. In this discourse, as Quarles puts it, Jesus recognizes that the Pharisees and their scribes are wicked shepherds and those who follow them do so at the peril of their own souls.<sup id="fnref29"><a href="#fn29">29</a></sup> The discourse of Matthew 23 is a condemnation on the leaders and by extension a warning to cease following them in their legalism and turn to Christ.</p>

        <h2 id="conclusion">Conclusion</h2>
        <p>The Jewish community at the time of Christ was legalistic to the point of rejecting their own Messiah. The Pharisees, Sadducees, and other religious leaders are characterized in the gospels as focused on external obedience to the law, but missing the heart of the law. Their rejection of John and his baptism led to their rejection of Christ. They did not confess their sins or turn to Christ for salvation; instead, they "trusted in themselves that they were righteous and disdained others" (Luke 18:9). Instead of keeping the law out of gratitude as advocates of the NPP have posited, they prided themselves on their works and excluded others in contempt. The Jewish community largely followed their various leaders in this embrace of legalism and refusal to believe in the Messiah. However, there were exceptions to this rule, beginning right away with the recipients of John's baptism. At the time of Christ many were ready to receive John's message: repent and follow the Lamb of God. The disciples and the blind man examined in this paper embody the response of the parabolic tax collector, crying out "God, be merciful to me, the sinner" (Luke 18:13). The disciples and the blind man were disdained by the majority of the Jewish community, who neglected the love commanded in the law. Yet they were not rejected by Jesus. This remnant among the Jews demonstrates that God graciously saves all who believe, even out of a nation that crucified Him. The life of Christ, even the rejection of Him by the legalistic Jews, was recorded, "so that you may believe that Jesus is the Christ, the Son of God; and that believing you may have life in His name" (John 20:31). God continues to save His remnant through their faith in Christ.</p>
