<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Capture the current path and query string that triggered the 404
    const pathSegmentsToKeep = 0; 
    const l = window.location;
    
    // Redirect back to index.html with the target path encoded in a query parameter
    location.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
      '/?redirect=' + encodeURIComponent(l.pathname + l.search)
    );
  </script>
</head>
<body>
</body>
</html>
